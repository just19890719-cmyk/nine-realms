<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>背包樣板 v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* =====================================================================
 * 諸神鐵匠・背包視覺樣板（第一階段，獨立頁，不影響遊戲本體）
 * 所有樣式都在 .b2 底下；正式整合時整段搬進 style.css，不會碰到其他頁面。
 *
 * 美術槽位：B2_ART（最下面的 script）。填了圖就用 9-slice／背景圖，
 * 沒填（null）就顯示「暫代外觀」：平色＋1px 線，只用來看比例與階層，不是最終材質。
 * ===================================================================== */
:root{
  /* 色票：深藍黑金屬 */
  --b2-ink:#05080d;      /* 頁面最底 */
  --b2-main:#0b111a;     /* 主面板 */
  --b2-sub:#070b12;      /* 次面板（更深一階） */
  --b2-well:#04070b;     /* 物品格內底 */
  --b2-steel:#2b3747;    /* 一般細框（冷鋼） */
  --b2-steel-hi:#4a5a70;
  --b2-gold:#b88f4a;     /* 金屬金框 */
  --b2-gold-hi:#f0cf86;  /* 選取、數值強調 */
  --b2-text:#e7e2d8;
  --b2-mute:#8d96a3;
  --b2-dim:#5d6672;
  --b2-num:#f4e2b8;
  --b2-danger:#e0594b;
  --b2-ok:#7fcf8c;
  /* 品階色（沿用遊戲 --l0～--l6，只拿來畫細框和文字，不整格發光） */
  --l0:#b9b1a3;--l1:#7fcf8c;--l2:#62a8ee;--l3:#ef5b4c;--l4:#c27ff0;--l5:#dff1ff;--l6:#f2b53c;
  /* 字級：12／13／15／17／22（數值）／20（標題） */
  --fs-xs:12px;--fs-s:13px;--fs-m:15px;--fs-l:17px;--fs-num:22px;--fs-title:20px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--b2-ink);color:var(--b2-text);font-family:var(--sans);font-size:var(--fs-m)}
button{font:inherit;color:inherit}
img{max-width:100%}

/* ---------- 遊戲外框（上方資源列、下方導覽）：只是讓樣板看起來在真實位置，這次不改 ---------- */
.b2-app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
.b2-top{flex:none;height:57px;display:flex;align-items:center;gap:8px;padding:0 max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid #1a222d;color:var(--b2-mute);font-size:var(--fs-s)}
.b2-top .who{flex:1;min-width:0}.b2-top .who b{display:block;color:var(--b2-text);font-size:var(--fs-m)}
.b2-top .chip{display:flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid #1d2733;border-radius:14px;color:var(--b2-num);font-variant-numeric:tabular-nums}
.b2-top .chip img{width:20px;height:20px}
.b2-nav{flex:none;height:66px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #1a222d;padding-bottom:env(safe-area-inset-bottom,0px)}
.b2-nav span{display:grid;place-items:center;font-size:var(--fs-xs);color:var(--b2-dim)}
.b2-nav span.on{color:var(--b2-gold-hi)}
.b2-note{flex:none;font-size:11px;line-height:1.3;color:#d9b36a;background:#1a1408;border-bottom:1px solid #3a2c10;text-align:center;padding:3px 8px}

/* ---------- 1. 主面板 ---------- */
.b2{flex:1;min-height:0;display:flex;flex-direction:column;margin:6px 8px;padding:8px 10px 10px;position:relative;
  background:var(--b2-main);border:1px solid var(--b2-steel);
  border-image-source:var(--art-main,none);border-image-slice:var(--art-main-slice,60) fill;border-image-width:var(--art-main-w,18px);border-image-repeat:stretch}
.b2.has-tex{background:var(--b2-main) var(--art-tex) center/cover}

/* 標題列：名稱置中、容量在右，下面一條容量細條 */
.b2-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;padding:2px 2px 6px}
.b2-head h2{grid-column:2;margin:0;font-family:var(--serif);font-weight:900;font-size:var(--fs-title);color:var(--b2-gold-hi);letter-spacing:.12em;line-height:1.2}
.b2-cap{justify-self:end;text-align:right;font-size:var(--fs-xs);color:var(--b2-mute);font-variant-numeric:tabular-nums;line-height:1.3}
.b2-cap b{color:var(--b2-num);font-size:var(--fs-s)}
.b2-cap i{display:block;width:72px;height:3px;margin-top:3px;background:#141c27;position:relative}
.b2-cap i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--b2-gold)}
.b2-cap.full b{color:var(--b2-danger)}

/* 分隔線（素材 divider） */
.b2-rule{height:9px;margin:0 -2px;background:var(--art-rule,linear-gradient(90deg,transparent,var(--b2-steel) 15%,var(--b2-steel) 85%,transparent) center/100% 1px no-repeat)}

/* ---------- 6. 頁籤：一般／選取／停用 ---------- */
.b2-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:6px 0 8px}
.b2-tab{position:relative;min-height:40px;border:1px solid var(--b2-steel);background:var(--b2-sub);color:var(--b2-mute);font-family:var(--serif);font-weight:900;font-size:var(--fs-m);letter-spacing:.08em;
  border-image-source:var(--art-tab,none);border-image-slice:30 fill;border-image-width:10px}
.b2-tab.on{color:var(--b2-gold-hi);border-color:var(--b2-gold);border-image-source:var(--art-tab-on,none)}
.b2-tab:disabled{color:#3d4550;border-color:#1a222c;border-image-source:var(--art-tab-off,none)}
.b2-tab .dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--b2-danger)}

/* ---------- 篩選：分類（圖示鈕）＋排序／狀態 ---------- */
.b2-cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px 2px}
.b2-cats::-webkit-scrollbar{display:none}
.b2-cat{flex:1 0 44px;max-width:56px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--b2-steel);background:var(--b2-sub);color:var(--b2-mute);font-size:11px;padding:0;
  border-image-source:var(--art-cat,none);border-image-slice:24 fill;border-image-width:8px}
.b2-cat img{width:28px;height:28px;object-fit:contain;opacity:.8;filter:var(--cat-ic-filter,grayscale(.7) brightness(.9))}
.b2-cat.on{color:var(--b2-gold-hi);border-color:var(--b2-gold);border-image-source:var(--art-cat-on,none)}
.b2-cat.on img{opacity:1;filter:none}
.b2-fil{display:flex;align-items:center;gap:6px;margin-top:6px}
.b2-sel{position:relative;flex:0 1 128px;min-width:0}
.b2-sel select{appearance:none;-webkit-appearance:none;width:100%;height:34px;border:1px solid var(--b2-steel);background:var(--b2-sub);color:var(--b2-text);font:inherit;font-size:var(--fs-s);padding:0 24px 0 10px;
  border-image-source:var(--art-field,none);border-image-slice:20 fill;border-image-width:7px}
.b2-sel::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--b2-gold);border-bottom:1.5px solid var(--b2-gold);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.b2-sel select option{background:#0b111a}
.b2-cnt{margin-left:auto;font-size:var(--fs-xs);color:var(--b2-mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.b2-cnt button{margin-left:6px;height:30px;padding:0 10px;border:1px solid var(--b2-gold);background:none;color:var(--b2-gold-hi);font-size:var(--fs-xs)}

/* ---------- 物品區（次面板，可捲動） ---------- */
.b2-well{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin-top:8px;padding:6px;background:var(--b2-sub);border:1px solid #18202b;
  border-image-source:var(--art-sub,none);border-image-slice:40 fill;border-image-width:12px;scrollbar-width:none}
.b2-well::-webkit-scrollbar{display:none}
.b2-sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 6px;font-family:var(--serif);font-weight:900;font-size:var(--fs-s);color:var(--b2-gold-hi);letter-spacing:.08em}
.b2-sec span{font-family:var(--sans);font-weight:400;font-size:var(--fs-xs);color:var(--b2-mute);letter-spacing:0}
.b2-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:340px){.b2-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ---------- 3～5. 物品格：深色內底＋細框＋品階細框＋選取金框 ---------- */
.b2-slot{position:relative;aspect-ratio:1;max-width:100%;padding:0;border:1px solid var(--b2-steel);background:var(--b2-well);
  box-shadow:inset 0 0 10px rgba(0,0,0,.9);
  border-image-source:var(--art-slot,none);border-image-slice:24 fill;border-image-width:8px}
.b2-slot .rim{position:absolute;inset:3px;border:1px solid color-mix(in srgb,var(--tc) 70%,transparent);pointer-events:none;
  border-image-source:var(--art-rim,none);border-image-slice:24;border-image-width:6px}
.b2-slot .w{position:absolute;left:17.5%;top:17.5%;width:65%;height:65%;object-fit:contain}   /* 安全距離 65%（與遊戲 wArt 一致，不能動） */
.b2-slot .lv{position:absolute;left:5px;bottom:2px;font-family:var(--serif);font-weight:900;font-size:var(--fs-s);color:var(--b2-gold-hi);text-shadow:0 0 2px #000,0 0 3px #000,1px 1px 0 #000}
.b2-slot .x{position:absolute;right:3px;bottom:3px;min-width:20px;padding:0 4px;font-size:11px;line-height:16px;font-weight:700;color:var(--b2-num);background:rgba(4,7,11,.86);border:1px solid #2b3747;border-radius:8px;font-variant-numeric:tabular-nums}
.b2-slot .lk{position:absolute;right:4px;top:4px;width:14px;height:14px}
.b2-slot .post{position:absolute;left:3px;top:3px;padding:0 4px;font-size:11px;line-height:15px;font-weight:700;color:#cdeed3;background:rgba(22,64,34,.92);border-radius:2px}
.b2-slot .nw{position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--b2-danger);box-shadow:0 0 4px var(--b2-danger)}
.b2-slot .curse{position:absolute;left:3px;top:3px;padding:0 4px;font-size:11px;line-height:15px;font-weight:700;color:#fff;background:#8c1f17;border-radius:2px}
.b2-slot.brk .w{filter:grayscale(.6) brightness(.7) sepia(.3) hue-rotate(-20deg)}
.b2-slot.brk .rim{border-color:rgba(224,89,75,.75)}
.b2-slot.sel{border-color:var(--b2-gold-hi);border-image-source:var(--art-slot-sel,none);box-shadow:inset 0 0 10px rgba(0,0,0,.9),0 0 0 1px rgba(240,207,134,.35),0 0 10px rgba(240,190,100,.25)}
.b2-slot.empty{border-color:#151c26;box-shadow:inset 0 0 8px rgba(0,0,0,.9);border-image-source:var(--art-slot-empty,none)}
.b2-slot .ic{position:absolute;left:14%;top:12%;width:72%;height:72%;object-fit:contain}
.b2-slot .glow{position:absolute;left:4px;top:2px;text-align:left;font-size:11px;font-weight:700;text-shadow:0 0 2px #000,0 0 3px #000}
.b2-slot .ph{position:absolute;inset:18%;display:grid;place-items:center;font-size:10px;color:var(--b2-dim);border:1px dashed #2b3747}
.b2-slot:active{transform:translateY(1px)}

/* ---------- 2. 次面板：詳情區（固定在面板底部，可展開） ---------- */
.b2-dock{flex:none;margin-top:8px;padding:10px;background:var(--b2-sub);border:1px solid var(--b2-steel);position:relative;
  border-image-source:var(--art-dock,none);border-image-slice:40 fill;border-image-width:12px}
.b2-dk-top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:start}
.b2-show{position:relative;width:84px;height:84px;border:1px solid color-mix(in srgb,var(--tc) 70%,#000);background:var(--b2-well);box-shadow:inset 0 0 14px rgba(0,0,0,.95);
  border-image-source:var(--art-show,none);border-image-slice:30 fill;border-image-width:10px}
.b2-show img{position:absolute;left:17.5%;top:17.5%;width:65%;height:65%;object-fit:contain}
.b2-nm{font-family:var(--serif);font-weight:900;font-size:var(--fs-l);line-height:1.3;padding-right:34px;word-break:keep-all;overflow-wrap:anywhere}
.b2-nm .lvt{color:var(--b2-gold-hi)}
.b2-sub{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:2px;font-size:var(--fs-xs);color:var(--b2-mute)}
.b2-sub .tier{font-weight:700}
.b2-sub .ok{color:var(--b2-ok)}
.b2-pw{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.b2-pw b{font-family:var(--serif);font-size:var(--fs-num);color:var(--b2-num);font-variant-numeric:tabular-nums}
.b2-pw span{font-size:var(--fs-xs);color:var(--b2-mute)}
.b2-lock{position:absolute;right:8px;top:8px;width:36px;height:36px;padding:0;border:0;background:none}
.b2-lock img{width:30px;height:30px}
/* 數值表：左標籤右數值，對齊成兩欄 */
.b2-stats{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin:10px 0 2px}
.b2-st{display:flex;justify-content:space-between;align-items:baseline;gap:6px;min-width:0;padding:5px 0;border-bottom:1px solid #141b25;font-size:var(--fs-s)}
.b2-st span{color:var(--b2-mute);white-space:nowrap}
.b2-st b{color:var(--b2-text);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b2-st b i{font-style:normal;color:var(--b2-gold-hi)}
.b2-lvbar{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin:10px 0 4px}
.b2-lvbar i{height:4px;background:#18202b}.b2-lvbar i.on{background:var(--c)}.b2-lvbar i.cur{box-shadow:0 0 5px var(--c)}
.b2-next{font-size:var(--fs-xs);color:var(--b2-mute);line-height:1.5}
.b2-next b{color:var(--b2-ok)}
.b2-desc{font-size:var(--fs-s);color:var(--b2-mute);line-height:1.6;margin-top:8px}
.b2-warn{font-size:var(--fs-xs);color:var(--b2-danger);margin-top:6px}
.b2-dock .more{display:none}
.b2-dock.open .more{display:block}
.b2-tgl{position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:44px;height:24px;border:1px solid var(--b2-steel);background:var(--b2-sub);padding:0}
.b2-tgl::after{content:"";position:absolute;left:50%;top:9px;width:7px;height:7px;border-left:1.5px solid var(--b2-gold);border-top:1.5px solid var(--b2-gold);transform:translateX(-50%) rotate(45deg)}
.b2-dock.open .b2-tgl::after{top:5px;transform:translateX(-50%) rotate(225deg)}

/* ---------- 7. 按鈕：主要／次要／危險；一般／按下／停用 ---------- */
.b2-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.b2-acts.r2{margin-top:6px}
.b2-btn{min-height:44px;padding:0 4px;border:1px solid var(--b2-steel-hi);background:#141c27;color:var(--b2-text);font-family:var(--serif);font-weight:900;font-size:var(--fs-m);letter-spacing:.06em;
  border-image-source:var(--art-btn2,none);border-image-slice:40 fill;border-image-width:12px}
.b2-btn.pri{border-color:var(--b2-gold);background:#2a2113;color:var(--b2-gold-hi);border-image-source:var(--art-btn1,none)}
.b2-btn.dan{border-color:#7a2a22;background:#2a0f0c;color:#ffb3a8;border-image-source:var(--art-btn3,none)}
.b2-btn:active:not(:disabled){transform:translateY(1px);filter:brightness(.85)}
.b2-btn.pri:active:not(:disabled){border-image-source:var(--art-btn1-p,var(--art-btn1,none))}
.b2-btn:disabled{color:#4a525d;border-color:#1c2430;background:#0c1118;border-image-source:var(--art-btn-off,none)}

/* 矮手機（高度不到 720，例如 iPhone SE）：詳情區、分類鈕縮小，讓格子至少留 2 排 */
@media (max-height:720px){
  .b2-head{padding-bottom:2px}.b2-head h2{font-size:var(--fs-l)}
  .b2-tabs{margin:4px 0 6px}.b2-tab{min-height:36px}
  .b2-cat{height:40px;font-size:0;gap:0}.b2-cat img{width:26px;height:26px}
  .b2-fil{margin-top:4px}.b2-sel select{height:32px}
  .b2-dock{padding:8px}.b2-dk-top{grid-template-columns:60px minmax(0,1fr);gap:8px}.b2-show{width:60px;height:60px}
  .b2-nm{font-size:var(--fs-m)}.b2-pw b{font-size:var(--fs-l)}.b2-acts{margin-top:8px}
}
.b2-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:340px;padding:8px 14px;background:#0b111a;border:1px solid var(--b2-gold);font-size:var(--fs-s);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.b2-toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.b2-toast{transition:none}}
</style>
</head>
<body>
<div class="b2-app">
  <div class="b2-note" id="note">背包樣板（第一階段）・框與底目前是暫代外觀，等新美術素材放進來才是最終質感</div>
  <div class="b2-top"><div class="who"><span>Lv.12</span><b>北境小鐵</b></div><span class="chip"><img data-src="art/it_gold.webp" alt="">128,450</span><span class="chip"><img data-src="art/it_gems.webp" alt="">320</span></div>
  <section class="b2" id="bag"></section>
  <nav class="b2-nav"><span>村莊</span><span>鐵匠鋪</span><span class="on">道具欄</span><span>交易所</span><span>商城</span></nav>
</div>
<div class="b2-toast" id="toast"></div>
<script src="data.js"></script>
<script>
// 素材路徑：放在 repo 的 proto/bag2/ 時圖片在兩層上面；做成預覽頁時圖片跟頁面同一層
const ROOT=location.pathname.includes('/proto/bag2')?'../..':'.';
const P=s=>ROOT+'/'+s;
document.querySelectorAll('img[data-src]').forEach(i=>i.src=P(i.dataset.src));

/* 美術槽位：新素材交付後填路徑（art/ui/bag2/…），null＝暫代外觀。尺寸與提示詞見「素材需求」 */
const B2_ART={
  main:null,     // 主面板 9-slice（含深藍黑金屬底、四角斜切小尖刺）
  tex:null,      // 主面板低對比紋理（可選，鋪在 main 下面）
  sub:null,      // 次面板／物品區 9-slice（更深一階、細框）
  dock:null,     // 詳情區 9-slice
  show:null,     // 詳情區武器展示框
  rule:null,     // 分隔線
  tab:null, 'tab-on':null, 'tab-off':null,
  cat:null, 'cat-on':null, field:null,
  slot:null, 'slot-sel':null, 'slot-empty':null, rim:null,   // rim：白色細框，CSS 依品階上色
  btn1:null, 'btn1-p':null, btn2:null, btn3:null, 'btn-off':null
};
(function applyArt(){const r=document.documentElement.style;for(const [k,v] of Object.entries(B2_ART))if(v)r.setProperty('--art-'+k,`url("${P(v)}")`);
  if(B2_ART.tex)document.getElementById('bag').classList.add('has-tex');
  if(Object.values(B2_ART).some(Boolean))document.getElementById('note').hidden=true})();

const D=BAG_DATA,LVC=D.lvc,ELC={fire:'#ff8a4c',ice:'#8fe3ff',bolt:'#ffe23a',toxic:'#8ed865',light:'#f0c560',dark:'#a99bc9'};
const ui={tab:'w',cat:'all',sort:'power',st:'all',sel:null,isel:null,open:false};
const fmt=n=>Number(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SORTS={power:['攻擊力',(a,b)=>b.pow-a.pow],lv:['強化等級',(a,b)=>b.lv-a.lv||b.pow-a.pow],cat:['類別',(a,b)=>a.cat.localeCompare(b.cat)||b.pow-a.pow],post:['駐守優先',(a,b)=>(!!b.post)-(!!a.post)||b.pow-a.pow],recent:['取得時間',(a,b)=>b.id-a.id]};
const STS=[['all','全部'],['idle','閒置'],['post','駐守'],['lock','鎖定']];
const wNameH=w=>`<span class="lvt">+${w.lv}</span> ${w.brk?'<span style="color:var(--b2-danger)">奧丁之咒</span> ':''}${w.el?`<span style="color:${ELC[w.el.k]};text-shadow:0 0 6px ${ELC[w.el.k]}66">${w.el.tn}</span> `:''}${esc(w.n)}`;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1600)}

function slotW(w){const tc=w.brk?'#e0594b':LVC[w.f];
  return `<button class="b2-slot ${ui.sel===w.id?'sel':''} ${w.brk?'brk':''}" style="--tc:${tc}" data-w="${w.id}" aria-label="${esc(w.n)} +${w.lv}">
    <span class="rim"></span><img class="w" src="${P(w.art)}" alt="">
    ${w.post?`<span class="post">駐 ${w.post}</span>`:w.brk?'<span class="curse">咒</span>':''}${w.lock?`<img class="lk" src="${P('art/ic_lock.webp')}" alt="已鎖定">`:w.nw?'<i class="nw"></i>':''}
    <span class="lv">+${w.lv}</span>${w.cnt>1?`<span class="x">×${w.cnt}</span>`:''}</button>`}
function slotI(it,kind){const on=ui.isel===kind+it.k;
  return `<button class="b2-slot ${on?'sel':''}" style="--tc:${it.glc||'#4a5a70'}" data-i="${kind+it.k}"><span class="rim"></span>
    ${it.art?`<img class="ic" src="${P(it.art)}" alt="">`:'<span class="ph">待生圖</span>'}${it.c?`<span class="x">×${fmt(it.c)}</span>`:''}${it.gl?`<span class="glow" style="color:${it.glc}">${it.gl}</span>`:''}</button>`}
const fill=(n,cols=5)=>Array.from({length:(cols-n%cols)%cols+cols},()=>'<span class="b2-slot empty"></span>').join('');

function list(){const ok=w=>(ui.cat==='all'||w.cat===ui.cat)&&(ui.st==='all'||(ui.st==='idle'&&!w.post)||(ui.st==='post'&&w.post)||(ui.st==='lock'&&w.lock));
  return D.stacks.filter(ok).sort(SORTS[ui.sort][1])}

function dockW(w){if(!w)return `<div class="b2-dock"><div class="b2-desc" style="margin:0;text-align:center">點一格武器，詳情會顯示在這裡</div></div>`;
  const tc=w.brk?'#e0594b':LVC[w.f],busy=!!w.post,max=w.lv>=12,auto=w.lv<w.stable;
  return `<div class="b2-dock ${ui.open?'open':''}"><button class="b2-tgl" data-act="tgl" aria-label="${ui.open?'收起詳情':'展開詳情'}"></button>
   <button class="b2-lock" data-act="lock" aria-label="${w.lock?'取消鎖定':'鎖定'}"><img src="${P(w.lock?'art/ic_lock.webp':'art/ic_unlock.webp')}" alt=""></button>
   <div class="b2-dk-top"><div class="b2-show" style="--tc:${tc}"><img src="${P(w.art)}" alt=""></div>
    <div style="min-width:0"><div class="b2-nm">${wNameH(w)}</div>
     <div class="b2-sub"><span class="tier" style="color:${tc}">${w.brk?'奧丁之咒':w.tier}</span><span>${w.catN}・${w.kind}</span>${w.post?`<span class="ok">駐守 ${w.post}</span>`:''}${w.cnt>1?`<span>同款 ${w.cnt} 把</span>`:''}</div>
     <div class="b2-pw"><b>${fmt(w.pow)}</b><span>攻擊力（每秒傷害）</span></div></div></div>
   <div class="more">
    <div class="b2-stats">
     <div class="b2-st"><span>攻速</span><b>${w.spd?w.spd.toFixed(1)+' 秒':'—'}</b></div>
     <div class="b2-st"><span>單擊</span><b>${fmt(w.hit)}</b></div>
     <div class="b2-st"><span>${w.proc?w.proc[0]:'附加效果'}</span><b>${w.proc?`<i>${w.proc[1]}</i>`:'—'}</b></div>
     <div class="b2-st"><span>相剋${w.race?' '+w.race[0]:''}</span><b>${w.race?`<i>+${w.race[1]}%</i>`:'—'}</b></div>
     <div class="b2-st" style="grid-column:1/-1"><span>附魔屬性</span><b>${w.brk?'<span style="color:var(--b2-danger)">奧丁之咒・要用矮人解咒石破除</span>':w.el?`<span style="color:${ELC[w.el.k]}">${w.el.tn}</span>・打中弱點傷害 +${w.el.up}%`:'<span style="color:var(--b2-dim)">無・附魔可獲得</span>'}</b></div>
    </div>
    <div class="b2-lvbar">${Array.from({length:13},(_,k)=>`<i class="${k<=w.lv?'on':''} ${k===w.lv?'cur':''}" style="--c:${LVC[[0,1,1,1,1,1,1,2,2,3,6,4,5][k]]}"></i>`).join('')}</div>
    <div class="b2-next">${max?'已達最高 +12':`下一級 +${w.next.lv}：${w.proc?w.proc[0]+' <b>'+w.next.proc+'</b>・':''}${w.race?'相剋 <b>+'+w.next.race+'%</b>・':''}攻擊力 <b>${fmt(w.next.pow)}</b>`}</div>
    ${w.brk?'<div class="b2-warn">奧丁之咒：不能強化、駐守、挑戰、上架。按「解咒」用矮人解咒石破除。</div>':busy?'<div class="b2-warn" style="color:var(--b2-mute)">駐守中的武器要先收回，才能強化、附魔或熔解。</div>':''}
    <div class="b2-acts r2" style="grid-template-columns:repeat(3,minmax(0,1fr))">
     <button class="b2-btn pri" data-act="x" ${busy||w.brk||!auto?'disabled':''}>${auto?'一鍵安定值':'已 +'+w.stable}</button>
     <button class="b2-btn" data-act="x" ${w.brk||busy?'disabled':''}>上架</button>
     <button class="b2-btn dan" data-act="x" ${busy||w.lock?'disabled':''}>熔解</button></div>
   </div>
   <div class="b2-acts">
    <button class="b2-btn pri" data-act="x" ${busy||w.brk||max?'disabled':''}>強化</button>
    <button class="b2-btn pri" data-act="x" ${busy?'disabled':''}>${w.brk?'解咒':'附魔'}</button>
    <button class="b2-btn" data-act="x" ${w.brk?'disabled':''}>${busy?'收回':'駐守'}</button>
    <button class="b2-btn" data-act="tgl">${ui.open?'收起':'詳情'}</button></div></div>`}

function dockI(it){if(!it)return `<div class="b2-dock"><div class="b2-desc" style="margin:0;text-align:center">點一格道具或材料，說明會顯示在這裡</div></div>`;
  return `<div class="b2-dock"><div class="b2-dk-top"><div class="b2-show" style="--tc:${it.glc||'#4a5a70'}"><img src="${P(it.art)}" alt="" style="left:10%;top:10%;width:80%;height:80%"></div>
   <div style="min-width:0"><div class="b2-nm" style="padding-right:0">${esc(it.n)}${it.gl?` <span style="color:${it.glc}">${it.gl}</span>`:''}</div>
    <div class="b2-sub"><span>${it.relic?'寶箱・打開隨機獲得':it.mat?'材料':'道具'}</span></div>
    <div class="b2-pw"><b>${fmt(it.c)}</b><span>持有</span></div></div></div>
   <div class="b2-desc">${esc(it.mat?it.info:it.desc)}</div>
   <div class="b2-acts" style="grid-template-columns:repeat(${it.relic?3:2},minmax(0,1fr))">${it.relic?`<button class="b2-btn" data-act="x" ${it.c?'':'disabled'}>打開 1 個</button><button class="b2-btn pri" data-act="x" ${it.c>1?'':'disabled'}>全部打開</button>`:''}<button class="b2-btn" data-act="x" ${it.c?'':'disabled'}>上架交易所</button>${it.relic?'':'<button class="b2-btn" data-act="x">哪裡掉</button>'}</div></div>`}

function render(){const B=document.getElementById('bag'),keep=B.querySelector('.b2-well'),y=keep?keep.scrollTop:0,cx=B.querySelector('.b2-cats'),x=cx?cx.scrollLeft:0;
  const pct=D.total/D.cap*100;
  let h=`<div class="b2-head"><h2>道具欄</h2><div class="b2-cap ${D.total>=D.cap?'full':''}"><b>${D.total}</b> / ${D.cap}<i style="--p:${pct}%"></i></div></div>
  <div class="b2-rule"></div>
  <div class="b2-tabs" role="tablist">${[['w','武器'],['m','材料'],['c','圖鑑']].map(([k,n])=>`<button class="b2-tab ${ui.tab===k?'on':''}" role="tab" aria-selected="${ui.tab===k}" data-tab="${k}">${n}${k==='c'?'<i class="dot"></i>':''}</button>`).join('')}</div>`;
  if(ui.tab==='w'){const ws=list(),filt=ui.cat!=='all'||ui.st!=='all',sel=D.stacks.find(w=>w.id===ui.sel);
    h+=`<div class="b2-cats">${D.cats.map(c=>`<button class="b2-cat ${ui.cat===c.k?'on':''}" data-cat="${c.k}"><img src="${P(c.ic)}" alt="">${c.n}</button>`).join('')}</div>
    <div class="b2-fil"><label class="b2-sel"><select id="sort" aria-label="排序">${Object.entries(SORTS).map(([k,[n]])=>`<option value="${k}" ${ui.sort===k?'selected':''}>排序：${n}</option>`).join('')}</select></label>
     <label class="b2-sel"><select id="st" aria-label="狀態">${STS.map(([k,n])=>`<option value="${k}" ${ui.st===k?'selected':''}>狀態：${n}</option>`).join('')}</select></label>
     <span class="b2-cnt">${filt?`${ws.reduce((a,w)=>a+w.cnt,0)}／${D.total} 把<button data-act="clr">清除</button>`:''}</span></div>
    <div class="b2-well"><div class="b2-grid">${ws.map(slotW).join('')}${fill(ws.length)}</div></div>${dockW(sel)}`}
  else if(ui.tab==='m'){const all=[...D.items,...D.mats.map(m=>({...m,mat:1}))],sel=all.find(it=>(it.mat?'m':'i')+it.k===ui.isel);
    h+=`<div class="b2-well" style="margin-top:0"><div class="b2-sec">道具<span>${D.items.length} 種・同一種疊一格，沒有上限</span></div><div class="b2-grid">${D.items.map(it=>slotI(it,'i')).join('')}</div>
      <div class="b2-sec" style="margin-top:12px">材料<span>${D.mats.length} 種</span></div><div class="b2-grid">${D.mats.map(it=>slotI(it,'m')).join('')}</div></div>${dockI(sel)}`}
  else h+=`<div class="b2-well" style="margin-top:0;display:grid;place-items:center"><div class="b2-desc" style="text-align:center">圖鑑這一頁這階段不改，<br>確認背包樣式後再套用同一套元件。</div></div>`;
  B.innerHTML=h;const nw=B.querySelector('.b2-well');if(nw)nw.scrollTop=y;const nc=B.querySelector('.b2-cats');if(nc)nc.scrollLeft=x}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.tab){ui.tab=d.tab;ui.open=false}else if(d.cat)ui.cat=d.cat;else if(d.w){ui.sel=+d.w}else if(d.i)ui.isel=d.i;
  else if(d.act==='tgl')ui.open=!ui.open;else if(d.act==='clr'){ui.cat='all';ui.st='all'}
  else if(d.act==='lock'){const w=D.stacks.find(x=>x.id===ui.sel);if(w){w.lock=!w.lock;toast(w.lock?'已鎖定（樣板）':'已取消鎖定（樣板）')}}
  else if(d.act==='x'){toast('樣板：正式版會照原本流程開啟「'+t.textContent.trim()+'」');return}else return;render()});
document.addEventListener('change',e=>{if(e.target.id==='sort')ui.sort=e.target.value;if(e.target.id==='st')ui.st=e.target.value;render()});
// 網址加 #m 直接看材料頁、#open 展開詳情（截圖用）
{const h=location.hash+location.search;if(h.includes('m'))ui.tab='m';ui.sel=D.stacks[1].id;ui.isel=h.includes('m')?'irelic_b':null;if(h.includes('open'))ui.open=true;if(h.includes('none'))ui.sel=null}
render();
</script>
</body>
</html>
