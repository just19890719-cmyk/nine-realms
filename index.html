<!doctype html>
<html lang="zh-Hant-TW"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0c09">
<title>諸神鐵匠</title>
<link rel="icon" type="image/png" sizes="32x32" href="art/icon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="art/icon/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="art/icon/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="諸神鐵匠">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://bzvilstgpjkztrydjwlt.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" media="print" onload="this.media='all'">
<style>
/* 九界鐵匠 style.css（v3.10 整理版）
 * 依元件分區；同一選擇器只定義一次（少數因覆蓋順序必須保留的除外）。
 * UI 皮膚（美術素材）在檔案最後的「UI 皮膚系統」區塊，預設全部關閉，不影響目前外觀。 */

/* ===== 設計變數（顏色、字型、圓角、陰影） ===== */
:root{--iron0:#0c0a08; --iron1:#151210; --iron2:#1d1814; --wood:#2b1e14; --wood2:#3b2a1b;
  --line:#4b3c2b; --line2:#6b5538;
  --bone:#f0e6d3; --ash:#ab9e89; --gold:#e8b85c; --gold-hi:#ffd98e; --ember:#e8792f;
  --frost:#8fc6e2; --ok:#82cc8f; --danger:#c23a30; --danger-hi:#ff7466;
  --q0:#b9b1a3; --q1:#7fcf8c; --q2:#62a8ee; --q3:#bb82ec; --q4:#f2aa3c;
  --r:8px; --shadow:0 6px 18px rgba(0,0,0,.55);
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;}

/* ===== 基礎元素 ===== */
*{box-sizing:border-box}
html,body{background:var(--iron0)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--iron1)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.05em}
h2{font-size:19px}
h3{font-size:16px}
body{color:var(--bone);font-family:var(--body);line-height:1.5;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 60% at 50% 0%,#24170e 0%,var(--iron0) 55%) fixed var(--iron0);font-size:15px}

/* ===== 版面與通用元件（面板、標題、數值列、標籤、進度條） ===== */
#view{max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ash)}
.center{text-align:center}
.right{text-align:right}
.t-ok{color:var(--ok)}
.t-danger{color:var(--danger-hi)}
.t-gold{color:var(--gold-hi)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.q0{color:var(--q0)}
.q1{color:var(--q1)}
.q2{color:var(--q2)}
.q3{color:var(--q3)}
.q4{color:var(--q4)}
.q0b{--qc:var(--q0)}
.q1b{--qc:var(--q1)}
.q2b{--qc:var(--q2)}
.q3b{--qc:var(--q3)}
.q4b{--qc:var(--q4)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px;vertical-align:middle}
.dot{position:absolute;top:4px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--danger-hi);box-shadow:0 0 6px var(--danger)}
.panel{border-radius:var(--r);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,220,160,.06),var(--shadow)}
.ptitle::before,.ptitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.goal{padding:9px 12px;border-left:3px solid var(--gold);background:rgba(232,184,92,.08);border-radius:0 6px 6px 0;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed rgba(107,85,56,.35)}
.kv span{color:var(--ash)}
.kv b{text-align:right}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.prog{height:16px;background:#070605;border:1px solid #3a2e22;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.prog.sm{height:14px;border-radius:7px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b84a14,var(--ember),var(--gold-hi));box-shadow:0 0 8px rgba(232,121,47,.6);transition:width .25s linear}
.prog i.full{background:linear-gradient(90deg,#8c2a22,var(--danger-hi))}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.gold{color:var(--gold-hi);border-color:var(--gold)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--ash);font-weight:500}
.catbar{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none}
.cat{flex:none;width:54px;min-height:56px;border-radius:6px;border:1px solid var(--line);background:var(--iron2);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;font-size:11px;color:var(--ash)}
.cat.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(232,184,92,.12)}
.pagehead{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;position:relative}
.pagehead h2{font-size:21px;color:var(--gold-hi)}
.pagehead .num{position:absolute;right:0;color:var(--ash)}
.tag-up{font-size:10px}
.cat img{object-fit:cover;width:34px;height:34px;border-radius:0}
.small{font-size:13px}
.label{letter-spacing:.12em;color:var(--ash);font-size:12.5px}
.ptitle{display:flex;align-items:center;gap:10px;color:var(--gold);font-family:var(--display);font-weight:700;letter-spacing:.08em;font-size:15px}
.tag-up{padding:0 5px;border-radius:3px;border:1px solid var(--gold);color:var(--gold-hi);white-space:nowrap;display:inline-block;margin-top:4px;margin-left:0}
.hscroll{display:flex;overflow-x:auto;gap:10px;margin-top:10px;padding-bottom:6px}
.hscroll .wt{flex:none;width:92px}
.panel{background:linear-gradient(#1c1612,#120f0c);display:flex;flex-direction:column;margin-top:12px;padding:14px;gap:12px;position:relative}
.hscroll,.catbar,.realms,.devtabs,.chips{scrollbar-width:none;-ms-overflow-style:none}
.hscroll::-webkit-scrollbar,.catbar::-webkit-scrollbar,.realms::-webkit-scrollbar,.devtabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none;height:0}
.hscroll,.catbar{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:24px}

/* ===== 按鈕 ===== */
.btn{position:relative;min-height:44px;padding:8px 16px;border-radius:6px;font-weight:700;letter-spacing:.04em;transition:transform .08s,filter .12s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:active:not(:disabled),.btn.is-pressed{transform:translateY(1px) scale(.985);filter:brightness(.88)}
.btn:disabled,.btn.is-disabled{filter:grayscale(.7) brightness(.7);opacity:.6;cursor:not-allowed}
.btn.big{min-height:52px;font-size:17px;font-family:var(--display);font-weight:900;width:100%}
.btn.sm{min-height:44px;padding:6px 12px;font-size:13px}
.btn-sec{background:linear-gradient(#2a221b,#1a1511);border:1px solid var(--line2);color:var(--bone);box-shadow:inset 0 1px 0 rgba(255,220,160,.08)}
.btn-danger{background:linear-gradient(#2a1513,#1a0d0c);border:1px solid #7d2a24;color:var(--danger-hi)}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:#120e0b;font-size:18px;color:var(--bone);display:grid;place-items:center;flex:none}
.chipbtn{min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--iron2);font-size:13px}
.chipbtn.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(232,184,92,.12)}
.stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.stepper button{width:44px;height:44px;background:#1d1712;border:0;font-size:20px}
.stepper b{min-width:40px;text-align:center;font-size:17px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;min-height:44px}
.toggle img{width:32px;height:32px}
.toggle input{accent-color:var(--ember);width:20px;height:20px}
.icon-btn.img{border:0;background:none;padding:0}
.icon-btn.img img{width:40px;height:40px}
.info-btn{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:#120e0b;color:var(--gold);font-size:17px;z-index:2;display:grid;place-items:center;padding:0}
.qchip{min-height:40px;min-width:52px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);background:var(--iron2);font-weight:700}
.qchip.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(232,184,92,.14)}
.btn-primary{border:1px solid #b88c45;border-image:none;border-radius:7px;padding:8px 16px;color:var(--gold-hi);
  background:linear-gradient(180deg,#6a4626 0%,#4a2f19 45%,#2f1d0f 100%);
  box-shadow:inset 0 1px 0 rgba(255,214,140,.45),inset 0 -2px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(20,12,6,.6),0 2px 10px rgba(0,0,0,.5);text-shadow:0 1px 2px #000}
.btn-primary:not(:disabled):hover{filter:brightness(1.08)}
.btn-primary.big,.btn-ember.big,.btn-risk.big{min-height:52px}
.btn .badge{margin-left:6px}

/* ===== 頂部資源列 ===== */
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px}
.res{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.player{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;min-height:44px;margin-right:auto;text-align:left;line-height:1.15;min-width:0}
.player .emblem{width:40px;height:40px;border-radius:50%;border:2px solid var(--line2);object-fit:cover;flex:none}
.player b{display:block;font-family:var(--display);font-size:13px;color:var(--gold-hi);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 8px 0 2px;border-radius:999px;background:#0b0907;border:1px solid var(--line);font-size:13px;flex:none}
.chip img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.gear{border-radius:50%;font-size:15px;color:var(--ash);flex:none;padding:0;border:0;background:none;width:40px;height:40px}
.gear img{width:40px;height:40px}
.plus{margin-left:2px;border-radius:4px;color:var(--gold-hi);font-size:14px;line-height:1;display:grid;place-items:center;padding:0;border:0;background:none;width:26px;height:26px}
.plus img{width:26px;height:26px}
.bar{top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(12px,env(safe-area-inset-left,0px)));padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(#1b1511,rgba(18,14,11,.96));border-bottom:1px solid var(--line);position:sticky}
.res .gear{margin-left:2px}
.mute{background:none;border:0;font-size:18px;width:44px;height:44px;padding:0;margin:0 -4px;opacity:.85;cursor:pointer;flex:none}
/* 頂部資源列窄螢幕（v3.12 修正）：名字放不下時改成徽章上的等級標記，320px 以下資源改到第二行；不縮小文字 */
.player{position:relative}
.player .lvb{display:none;position:absolute;left:22px;top:28px;min-width:22px;padding:0 3px;border-radius:7px;background:#1b130c;border:1px solid var(--line2);color:var(--gold-hi);font:700 11px/14px var(--display);font-style:normal;text-align:center}
@media (max-width:420px){.player .pname{display:none}.player .lvb{display:block}.player{min-width:44px;flex:none}}
@media (max-width:360px){.res{flex-wrap:wrap;row-gap:4px}.res::before{content:"";order:2;flex-basis:100%;height:0}.res .chip{order:3}.res .chip:first-of-type{margin-left:auto}.res .gear{order:1}.res .mute{order:1}}

/* ===== 底部分頁列 ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(#1d1611,#0f0c09);border-top:1px solid var(--line2);box-shadow:0 -6px 18px rgba(0,0,0,.6);
  padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{position:relative;background:none;border:0;min-height:60px;padding:2px 0;border-radius:6px;font-size:12px;color:var(--ash);display:flex;flex-direction:column;align-items:center;gap:0}
.nav button.on{color:var(--gold-hi);background:none}
.nav button img{width:44px;height:44px;opacity:.55;transition:opacity .15s;position:relative;z-index:1}
.nav button.on::before{content:'';position:absolute;left:50%;top:24px;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle,rgba(232,121,47,.38) 0%,rgba(232,121,47,.14) 40%,rgba(232,121,47,0) 70%);pointer-events:none}
.nav button.on img{opacity:1;filter:none}

/* ===== 底部抽屜、置中彈窗、提示訊息 ===== */
.scrim{position:fixed;inset:0;background:rgba(5,4,3,.78);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;overscroll-behavior:contain;background:linear-gradient(#1a1410,#0f0c09);border:1px solid var(--line2);border-bottom:0;border-radius:14px 14px 0 0;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
.sheet.full{max-height:100%;height:100%;border-radius:0;padding-top:calc(6px + env(safe-area-inset-top,0px))}
.sheet-head{position:sticky;top:-8px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;background:linear-gradient(#1a1410 80%,transparent)}
.sheet-head h2{font-size:18px;color:var(--gold-hi)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,4,3,.8);display:grid;place-items:center;padding:20px}
.modal-card{width:min(92vw,380px);padding:14px;border-radius:12px;background:linear-gradient(#1f1812,#110d0a);border:1px solid var(--line2);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;animation:pop .25s ease-out}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hico{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:6px;background:#0c0a08;border:1px solid var(--line);font-size:13px;font-weight:700}
.hico img{width:48px;height:48px;border-radius:4px}
.toasts{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
@media (max-width:360px){.toasts{top:calc(104px + env(safe-area-inset-top,0px))}} /* 頂部列兩行時，提示訊息往下移 */
.toast{padding:10px 12px;border-radius:6px;background:rgba(36,28,20,.97);border:1px solid var(--line2);font-size:13px;animation:up .2s ease-out;box-shadow:var(--shadow)}
.toast.ok{border-color:#3f7a4b}
.toast.bad{border-color:#7d2a24;color:#ffc0b8}
.info-ico{display:grid;place-items:center}
.info-ico img{width:72px;height:72px}
.info-body{font-size:14px;line-height:1.6}

/* ===== 鐵匠鋪 ===== */
.hero{position:relative;margin:10px calc(-1 * max(12px,env(safe-area-inset-left,0px))) 0;height:min(78vw,360px);overflow:hidden;border-bottom:1px solid var(--line);
  background:url(art/bg_forge.webp) 30% 45%/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 70%,rgba(12,10,8,.95))}
.hero .smith{position:absolute;left:50%;transform:translateX(-72%);bottom:-24%;height:110%;width:auto;max-width:none;filter:drop-shadow(0 0 22px rgba(0,0,0,.85));z-index:1}
.side{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.side-btn{min-height:44px;padding:4px 12px 4px 4px;border-radius:6px;background:rgba(14,11,8,.82);border:1px solid var(--line2);font-size:13px;display:flex;align-items:center;gap:6px;justify-content:flex-start}
.side-btn img{width:32px;height:32px}
.comm{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;width:min(46%,200px);z-index:2;padding:8px 10px;border-radius:var(--r);background:rgba(14,11,8,.88);border:1px solid var(--line2);display:flex;flex-direction:column;gap:6px}
.comm-in{display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.3}
.comm-img{width:44px;height:44px;border-radius:4px;object-fit:cover;flex:none}
.comm .btn{width:100%}
.subtabs{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px;margin-top:10px}
.subtabs button{position:relative;min-height:44px;border-radius:6px;border:1px solid var(--line);background:var(--iron2);font-family:var(--display);font-weight:700;color:var(--ash)}
.subtabs button.on{color:var(--gold-hi);border-color:var(--gold);background:linear-gradient(#3a2817,#22180f)}
.subtabs .dot{top:6px;right:8px}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.matbox{display:flex;flex-direction:column;align-items:center;width:72px;padding:4px 2px;border-radius:6px;background:#0d0b09;border:1px solid var(--line);font-size:11px;text-align:center}
.matbox img{width:40px;height:40px;border-radius:4px}
.matbox .mb-n{color:var(--ash);line-height:1.2}
.matbox .mb-c{font-variant-numeric:tabular-nums;font-weight:700}
.matbox.lack{border-color:#7d2a24}
.matbox.lack .mb-c{color:var(--danger-hi)}
.matgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.matgrid .matbox{width:auto}
.qrow{display:flex;gap:10px;align-items:center}
.qimg{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.big-ico{width:52px;height:52px;flex:none}
.qbar{display:flex;border-radius:5px;overflow:hidden;font-size:10px;text-align:center;line-height:1.2}
.qbar span{padding:4px 1px;min-width:34px;background:#0d0b09;border-right:1px solid #000;min-width:0;overflow:hidden}
.sel-bp{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,184,92,.25) inset,var(--shadow)}
.sel-head{display:flex;gap:12px;align-items:center}
.sel-head h3{font-size:20px;color:var(--gold-hi)}
.lack-line{padding:8px 10px;border-radius:6px;background:rgba(194,58,48,.12);border:1px solid rgba(194,58,48,.45);color:#ffc0b8;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lack-line .btn{margin-left:auto}
.matbox.need{width:84px;gap:0}
.matbox .mb-have{font-size:12px;color:var(--ash)}
.matbox .mb-need{font-size:13px;font-weight:700}
.matbox.ok .mb-need{color:var(--ok)}
.matbox.lack .mb-have{color:var(--danger-hi)}
.matbox.lack .mb-need{color:var(--bone)}
.qtyrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.forge-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px;align-items:center;margin-top:12px;padding:8px 10px;border-radius:10px;
  background:linear-gradient(#2a1d12,#150f0a);border:1px solid var(--gold);box-shadow:0 -4px 18px rgba(0,0,0,.6)}
.fb-info{display:flex;gap:8px;align-items:center;flex:1;min-width:0}
.fb-info>span{display:flex;flex-direction:column;min-width:0}
.fb-img{width:44px;height:44px;border-radius:6px;flex:none}
.qimg.wart,.fb-img.wart{background:#120d08;border:1px solid var(--line2)}

/* ===== 武器格與武器顯示元件 ===== */
.wt.on{outline:2px solid var(--gold-hi);outline-offset:1px}
.wt-art .frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wt-tr{font-size:9px}
.wt.bp .wt-name{color:var(--bone)}
.wt.locked .art{filter:grayscale(1) brightness(.35)}
.tilebox{width:96px;flex:none}
.wmini{width:24px;height:24px;border-radius:3px;flex:none}
.wgrid{display:grid;margin-top:10px;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wt{position:relative;display:flex;flex-direction:column;align-items:stretch;border-radius:7px;border:1px solid color-mix(in srgb,var(--qc,var(--line2)) 55%,#000);background:linear-gradient(#17120e,#0d0a08);text-align:center;min-width:0;padding:4px 4px 6px}
.wt-q{font-size:12px}
.wt.posted{border-color:#3f7a4b;box-shadow:inset 0 0 0 1px rgba(130,204,143,.35)}
.wt.locked-fav .wt-lock{background:rgba(232,184,92,.25)}
.sel-art{position:relative;width:110px;height:110px;flex:none;border-radius:6px;overflow:hidden;background:#090706}
.sel-art .frame{position:absolute;inset:0;width:100%;height:100%}
.testtag,.wt-test{display:inline-block;font-size:12px;padding:0 6px;border-radius:3px;background:#3a5a8a;color:#fff}
.wt-art .art{position:absolute;inset:9%;width:82%;height:82%;object-fit:contain}
.wt-lock{position:absolute;right:7%;top:4%;font-size:12px;right:4%;top:3%;background:rgba(0,0,0,.75);border-radius:50%;padding:1px;line-height:0;right:11%;top:10%;z-index:2}
.wt-locktxt{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--ash);padding:4px;line-height:1.25;z-index:2}
.wt.posted .wt-tr{bottom:calc(9% + 24px)}
.sel-art .art{position:absolute;inset:9%;width:82%;height:82%;object-fit:contain}
.wt-art .art,.sel-art .art{inset:15%;width:70%;height:70%}
.wt-lv{position:absolute;left:7%;top:5%;font-family:var(--display);font-weight:900;color:var(--gold-hi);font-size:16px;left:12%;top:11%;z-index:2;border-radius:4px;line-height:1.35;left:13%;top:12%;background:none;padding:0;text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.wt-lock,.wt.locked-fav .wt-lock{right:13%;top:13%;background:none;padding:0}
.wt-lock img{width:20px;height:20px;filter:drop-shadow(0 0 2px #000)}
.wt-name .wt-lv{position:static;display:inline;margin-right:3px;padding:0;background:none;font-size:inherit;color:var(--gold-hi);text-shadow:none;font-family:inherit}
.wt-name .wt-lk{display:inline-block;width:14px;height:14px;margin-left:2px;vertical-align:-2px}
.wt-meta{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:0 2px;white-space:nowrap}
.wt-meta .wt-tr{position:static;margin-left:4px;padding:0;background:none;color:#aee0b6;text-shadow:none;font-weight:400}
.wt-name{line-height:1.2;font-size:14px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-test{position:absolute;left:4px;bottom:22px;left:12%;bottom:12%;z-index:2;left:12%;top:12%;bottom:auto}
.wart{position:relative;display:block;aspect-ratio:1;flex:none;overflow:visible}
.wart .wart-w{position:absolute;object-fit:contain;max-width:none;z-index:1}
.wart .wart-f{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.wt-art{position:relative;display:block;aspect-ratio:1;max-width:100%;border-radius:4px;overflow:hidden;background:#090706}
.wt-art .wart{width:100%;height:100%}
.sel-art .wart{width:100%;height:100%}
.wmini.wart{background:#120d08}
.wt-meta .wt-tst{margin-left:4px;padding:0 4px;border-radius:3px;background:#3a5a8a;color:#fff;font-size:11px}

/* ===== 武器庫 ===== */
.empty{padding:18px 10px;text-align:center;color:var(--ash);font-size:13px}
.filters{margin-top:8px}
.sel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ash)}
.sel select{min-height:36px;border-radius:6px;border:1px solid var(--line2);background:var(--iron2);color:var(--bone);padding:0 8px;font:inherit}
.wlist{min-height:calc(100vh - 330px)}
.filterbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--ash)}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 12px;margin-top:10px;border:1px dashed var(--line2);border-radius:10px;text-align:center}
.empty-state img{width:64px;height:64px;opacity:.85}
.empty-state .btn{min-width:180px}
.filters3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.filters3 .sel{flex-direction:column;align-items:stretch;gap:2px;font-size:12px}
.filters3 select{width:100%;min-height:40px}

/* ===== 村莊與九界 ===== */
.realm{position:relative;margin:10px calc(-1 * max(12px,env(safe-area-inset-left,0px))) 0;padding:16px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background-size:cover;background-position:center 40%;border-bottom:1px solid var(--line)}
.realm::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,12,18,.35),rgba(10,8,6,.92))}
.realm>*{position:relative}
.realm-in{display:flex;align-items:center;justify-content:space-between}
.realm h1{font-size:26px;color:var(--gold-hi);text-shadow:0 2px 8px #000}
.arr{width:44px;height:44px;display:grid;place-items:center;font-size:26px;color:var(--gold)}
.arr.off{opacity:.3}
.realms{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.rlm{font-size:10px}

/* ===== 版面與通用元件（面板、標題、數值列、標籤、進度條）（續：此段必須排在前一區之後，才能保持原本的覆蓋順序） ===== */
.wt-pow,.wt-tr,.cat span,.matbox,.rlm,.qbar,.badge,.wt-post,.tag-up{font-size:12px}

/* ===== 武器格與武器顯示元件（續：此段必須排在前一區之後，才能保持原本的覆蓋順序） ===== */
.wt-pow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--bone);font-variant-numeric:tabular-nums}
.wt-tr{position:absolute;right:7%;bottom:7%;border-radius:3px;color:#aee0b6;right:12%;bottom:12%;z-index:2;background:none;padding:0;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.wt-post{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(30,90,45,.9));color:#c9f5d1;padding:6px 0 2px;font-size:12px;font-weight:700;left:9%;right:9%;bottom:9%;z-index:2;border-radius:0 0 3px 3px;left:9%;right:9%;bottom:10%}
.wt-post,.wt-test{z-index:3}

/* ===== 村莊與九界（續：此段必須排在前一區之後，才能保持原本的覆蓋順序） ===== */
.rlm img,.rlm .rlock{width:48px;height:48px;border-radius:50%;border:2px solid var(--line2);background:#0d0b09;display:grid;place-items:center;font-size:16px}
.rlm.on{color:var(--gold-hi)}
.vbar{margin-top:10px}
.vlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.vcard .vthumb{width:64px;height:64px;border-radius:6px;object-fit:cover;flex:none}
.vcard.locked{opacity:.5;cursor:default}
.vcard.ready{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,184,92,.35) inset,0 0 14px rgba(232,184,92,.15)}
.vcard.full{border-color:#7d2a24;box-shadow:0 0 14px rgba(194,58,48,.2)}
.vcard .prog{margin-top:4px}
.vst{font-size:12px;font-weight:700;white-space:nowrap}
.vst.hunt{color:var(--ok)}
.vst.ready{color:var(--gold-hi)}
.vst.full{color:var(--danger-hi)}
.vside{flex:none;display:flex;align-items:center}
.drops{display:flex;gap:3px}
.dico{width:28px;height:28px;border-radius:4px;border:1px solid var(--line)}
.vrow{display:flex;gap:10px;align-items:center;width:100%;padding:6px;border-radius:6px;border:1px solid var(--line);background:#0d0b09;text-align:left;min-height:60px}
.vrow .vthumb{width:48px;height:48px;border-radius:5px;object-fit:cover}
.vrow.dim{opacity:.5}
.strats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.strat{min-height:120px;border-radius:6px;border:1px solid var(--line);background:#0d0b09;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;font-size:12px;line-height:1.35}
.strat img{width:44px;height:44px}
.strat.on{border-color:var(--gold-hi);background:linear-gradient(#2c1f12,#120d09);box-shadow:0 0 12px rgba(232,184,92,.25)}
.strat b{font-family:var(--display);color:var(--gold)}
.rlm img{border:0;background:none;width:52px;height:52px;border-radius:0}
.rlm.on img{border-color:var(--gold);border:0;box-shadow:none;filter:drop-shadow(0 0 8px rgba(232,184,92,.7))}
.vcard{display:flex;gap:10px;align-items:center;padding:6px 8px 6px 6px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(90deg,#1c1612,#110e0b);cursor:pointer;min-height:76px;position:relative}
.vcard.next{border-color:var(--ember);box-shadow:0 0 0 1px rgba(232,121,47,.4) inset,0 0 16px rgba(232,121,47,.22);margin-top:8px}
.next-tag{position:absolute;top:-10px;left:10px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:4px;background:var(--ember);color:#1a0d04}
.vcard.pause{opacity:.8}
.vcard.pause .vthumb{filter:grayscale(.6)}
.vst.open{color:var(--ember)}
.vst.pause{color:var(--ash)}
.vcard .num{white-space:nowrap}
.wchip{flex:0 1 auto;min-width:0;display:inline-flex;align-items:center;gap:4px;padding:1px 6px 1px 1px;border-radius:4px;border:1px solid color-mix(in srgb,var(--qc) 50%,#000);background:#0d0b09;white-space:nowrap;max-width:60%;overflow:hidden}
.btn.harvest{min-width:76px;padding:2px 8px;line-height:1.2;animation:pulse 1.6s ease-in-out infinite}

/* ===== 鐵匠鋪（續：此段必須排在前一區之後，才能保持原本的覆蓋順序） ===== */
.forge-bar .btn{min-width:120px}

/* ===== 村莊與九界（續：此段必須排在前一區之後，才能保持原本的覆蓋順序） ===== */
.vlocked{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);border:1px dashed var(--line);color:var(--ash);font-size:14px}
.vlocked .lk{width:32px;height:32px;opacity:.7}
.hm{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--gold-hi)}
.hm img{width:20px;height:20px;border-radius:3px}
.harvest-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:68px;min-height:56px;padding:4px 2px;border-radius:8px;
  border:1px solid #f0c060;background:linear-gradient(180deg,#e8b85c,#b07a2a);color:#1e1206;box-shadow:inset 0 1px 0 rgba(255,240,200,.7),0 0 12px rgba(232,184,92,.35);
  animation:pulse 1.6s ease-in-out infinite;line-height:1.15}
.harvest-btn span{font-size:13px;font-weight:700}
.harvest-btn b{font-size:17px;font-variant-numeric:tabular-nums}
.harvest-btn:active,.harvest-btn.is-pressed{transform:translateY(1px)}
.vcard .row.nowrap>b.grow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .vst{flex:none}
.rlm{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ash);text-align:center;line-height:1.2;position:relative;width:64px}
.rlm span{white-space:nowrap}
.rlm img.locked{filter:grayscale(.55) brightness(.6)}
.rlm .rl{position:absolute;top:16px;left:50%;top:auto;bottom:16px;left:auto;right:4px;transform:none;width:22px;height:22px;filter:drop-shadow(0 0 2px #000)}
.rlm.off{color:#8c8378}

/* ===== 商店 ===== */
.banner{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:120px;padding:10px 12px;border-radius:var(--r);background-size:cover;background-position:center;overflow:hidden;font-size:13px}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(0,0,0,.88))}
.banner span{position:relative}
.item{display:flex;gap:10px;align-items:center}
.item img{width:48px;height:48px;border-radius:6px;flex:none}
.gems3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gemcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:6px;border:1px solid var(--line2);background:#0d0b09;min-height:100px}
.gemcard img{width:44px;height:44px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pgrid.three{grid-template-columns:repeat(3,1fr)}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 8px;border-radius:8px;border:1px solid var(--line);background:#0d0b09;text-align:center}
.pcard .info-btn{top:4px;right:4px;width:30px;height:30px;font-size:14px}
.pc-ico{width:56px;height:56px}
.pcard b{font-size:14px}
.pc-buy{width:100%;margin-top:4px}
.month.on{border-color:var(--gold)}
.month .item{padding-right:40px}
.gemcard .price{font-size:13px;color:var(--gold-hi);font-weight:700}
.gacha{display:flex;gap:10px;align-items:center;padding-right:36px}
.g-ico{width:52px;height:52px}
.mlist{display:flex;flex-direction:column;gap:8px}

/* ===== 武器視窗（詳情、附魔、交付） ===== */
.lvt{color:var(--gold-hi);font-family:var(--display);font-weight:900}
.aff{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;background:rgba(240,170,60,.15);color:var(--q4);margin-left:4px}
.trait{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;background:rgba(130,204,143,.14);color:#aee0b6;margin:2px 4px 0 0}
.powbox{display:flex;flex-direction:column;align-items:flex-end;padding:4px 10px;border:1px solid var(--line2);border-radius:6px;background:rgba(0,0,0,.35)}
.powbox b{font-family:var(--display);font-size:20px;color:var(--gold-hi);line-height:1.1}
.slot-pill{flex:1;text-align:center;padding:6px 4px;border-radius:5px;border:1px solid var(--line);font-size:12px;color:var(--ash)}
.slot-pill.on{border-color:var(--gold);color:var(--gold-hi)}
.showcase.mini .sc-art img{width:min(36vw,150px)}
.sc-art{position:absolute;inset:0;display:grid;place-items:center}
.sc-art img{width:min(70vw,290px);mix-blend-mode:lighten;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--qc) 60%,transparent))}
.sc-top,.sc-bot{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sc-bot{align-items:flex-end}
.sc-top h2{font-size:22px;text-shadow:0 2px 6px #000}
.qpill{display:inline-block;margin-top:4px;padding:1px 10px;border-radius:4px;font-size:12px;border:1px solid var(--qc);color:var(--qc);background:rgba(0,0,0,.5)}
.trow{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;background:#0d0b09;border:1px solid var(--line)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.eslot{min-height:84px;border-radius:6px;border:1px solid var(--line2);background:#0d0b09;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-size:12px}
.eslot img{width:36px;height:36px;border-radius:4px}
.eslot.on{border-color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi) inset}
.eslot.locked{opacity:.55}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.acts3:has(> :only-child){grid-template-columns:1fr}
.acts2+.acts3+.small{margin-top:6px}
.affgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.affpick{min-height:64px;border-radius:6px;border:1px solid var(--line);background:#0d0b09;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px;font-size:12px}
.affpick img{width:28px;height:28px;border-radius:4px}
.affpick.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(232,184,92,.1)}
.eslot .lk{font-size:18px;width:26px;height:26px}
.tico{width:40px;height:40px;object-fit:cover;flex:none;border:0;border-radius:0}
.powbox.inline{display:inline-flex;flex-direction:row;align-items:baseline;gap:6px;margin-top:4px;padding:2px 8px}
.powbox.inline b{font-size:17px}
.sc-art .sc-w img{mix-blend-mode:normal;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--qc) 60%,transparent))}
.showcase{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid color-mix(in srgb,var(--qc) 50%,#000);background:radial-gradient(60% 60% at 50% 45%,color-mix(in srgb,var(--qc) 28%,transparent),#0b0907 70%);justify-content:space-between;padding:12px;display:flex;flex-direction:column;min-height:0}
.showcase .sc-art{position:relative;inset:auto;display:flex;justify-content:center;align-items:center;margin:6px 0}
.sc-art .sc-w{width:min(58vw,240px)}
.showcase.mini{min-height:0}
.showcase.mini .sc-art .sc-w{width:min(30vw,120px)}

/* ===== 強化畫面（符文石碑） ===== */
.warn{padding:10px 12px;border-radius:6px;background:rgba(194,58,48,.14);border:1px solid rgba(194,58,48,.6);color:#ffc0b8;font-size:13px;margin-top:10px}
.enh-stage.safe{background:radial-gradient(55% 55% at 50% 45%,rgba(232,184,92,.35),transparent 70%),url(art/fx_ok.webp) center/70% no-repeat,#0b0907;background-blend-mode:normal,screen}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.optcard{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:#0d0b09;min-height:56px;font-size:13px;line-height:1.25}
.optcard img{width:36px;height:36px;flex:none}
.optcard span{flex:1;min-width:0;display:flex;flex-direction:column}
.optcard input{accent-color:var(--ember);width:20px;height:20px;flex:none}
.optcard.on{border-color:var(--gold);background:rgba(232,184,92,.1)}
.optcard.off{opacity:.55}
.fx2-aura{inset:6%;border-radius:50%;opacity:0}
.fx2-shards{inset:12% 14% 20% 14%;z-index:3;pointer-events:none}
.fx2-shards .sh{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;filter:sepia(1) hue-rotate(-45deg) saturate(3) brightness(1.6)}
.sh.s0{clip-path:polygon(0 0,55% 0,40% 45%,0 35%)}
.sh.s1{clip-path:polygon(55% 0,100% 0,100% 40%,60% 50%,40% 45%)}
.sh.s2{clip-path:polygon(0 35%,40% 45%,35% 100%,0 100%)}
.sh.s3{clip-path:polygon(60% 50%,100% 40%,100% 100%,65% 100%)}
.sh.s4{clip-path:polygon(40% 45%,60% 50%,65% 100%,35% 100%)}
.fx2-flash{inset:-10%;border-radius:50%;opacity:0;z-index:5;mix-blend-mode:screen;pointer-events:none}
.enh-name{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.enh-name b{font-family:var(--display);font-size:20px}
.enh-stage.danger{border-color:#7d2a24;background:radial-gradient(60% 55% at 50% 50%,rgba(194,58,48,.24),transparent 70%),linear-gradient(#1f100c,#0c0807);box-shadow:inset 0 0 40px rgba(194,58,48,.35)}
.enh-stage{flex-direction:column;align-items:center;justify-content:flex-end;position:relative;height:min(82vw,330px);border-radius:10px;overflow:hidden;border:1px solid var(--line2);display:block;padding:0;min-height:0;background:radial-gradient(60% 55% at 50% 50%,rgba(232,184,92,.16),transparent 70%),linear-gradient(#1c1510,#0d0a08);--sq:min(82vw,330px)}

.enh-stage{isolation:isolate} /* v3.12：石碑內的標籤（危險區、+9→+10）捲動時不再浮到抽屜標題上面 */

.enh-lv{position:static;display:flex;align-items:baseline;gap:8px;font-size:18px;text-shadow:0 2px 6px #000;background:rgba(0,0,0,.55);padding:2px 10px;border-radius:999px}

.enh-ribbon{position:absolute;left:8px;right:8px;bottom:8px;z-index:7;text-align:center;opacity:0;pointer-events:none;padding:6px 8px 7px;border-radius:8px;
  background:linear-gradient(transparent,rgba(0,0,0,.78) 30%);display:flex;flex-direction:column;gap:1px}
.enh-ribbon.show{opacity:1}

.enh-stage.playing .enh-hint{opacity:.75}
.stage-sq canvas{inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.enh-core{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.enh-core>div{display:flex;flex-direction:column;gap:1px;padding:9px 10px;border-radius:8px;background:#0d0b09;border:1px solid var(--line)}

.optcard.lack{border-color:#7d2a24;background:rgba(194,58,48,.12)}
.btn-risk{background:linear-gradient(#7a1d17,#4a0f0c);border:1px solid #c2453a;color:#ffd6b0;text-shadow:0 1px 2px #000;box-shadow:0 0 16px rgba(194,58,48,.35),inset 0 1px 0 rgba(255,180,140,.2)}

.stage-sq{overflow:hidden;border-radius:6px;background:radial-gradient(70% 70% at 50% 45%,#1b1712,#050404 75%)}
.stage-sq .ly{position:absolute;pointer-events:none}

.stage-sq .rn-stone.glow{opacity:0}
.stage-sq .rn-stone.glow.ph{background:radial-gradient(42% 42% at 50% 50%,rgba(255,196,90,.35),rgba(255,160,60,0) 70%)}
.stage-sq .rn-wpn{left:20.7%;top:12%;width:56%;height:56%;z-index:3;transform-origin:50% 50%;transform:rotate(22.5deg)}
.rn-wpn .wimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,170,80,.22))}
/* v3.14 武器漂浮：武器離開石面上下緩慢浮動，石面上留一塊會跟著呼吸的柔和影子（用 translate／scale 個別屬性，不影響強化動畫的 transform 時間軸） */
.stage-sq .rn-wpn{animation:rnFloat 3.2s ease-in-out infinite}
.stage-sq .rn-shadow{left:20.7%;top:12%;width:56%;height:56%;z-index:2;transform-origin:50% 50%;transform:translate(4%,15%) rotate(22.5deg);opacity:.8;animation:rnShadow 3.2s ease-in-out infinite;pointer-events:none}
.rn-shadow img{width:100%;height:100%;object-fit:contain;filter:brightness(0) blur(5px)}
@keyframes rnFloat{0%,100%{translate:0 -4%}50%{translate:0 -10%}}
@keyframes rnShadow{0%,100%{opacity:.8;scale:.97}50%{opacity:.5;scale:.88}}
@media (prefers-reduced-motion:reduce){.stage-sq .rn-wpn{animation:none;translate:0 -7%}.stage-sq .rn-shadow{animation:none;opacity:.65}}
.rn-wpn .fx2-shards{position:absolute;inset:0}
.rn-wpn .fx2-shards .sh{opacity:0}
.rn-wpn .rn-climb{position:absolute;left:36%;width:28%;top:-10%;height:120%;opacity:0;transform:rotate(45deg)}
.rn-climb img{width:100%;height:100%;object-fit:fill}
.stage-sq .seq{visibility:hidden}
.stage-sq .seq img{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.stage-sq .rn-light{left:18.7%;top:-.2%;width:60%;height:60%;z-index:4}
.stage-sq .rn-eclipse{left:55.7%;top:-7%;width:40%;height:40%;z-index:4}
.stage-sq .rn-spark{left:26.7%;top:18%;width:44%;height:44%;z-index:4}
.stage-sq .rn-climax{left:5%;top:0;width:90%;height:90%;z-index:6}
.stage-sq .rn-res{left:6%;top:0;width:88%;height:88%;z-index:5}
.stage-sq .rn-shatter img{mix-blend-mode:normal}
.stage-sq .fx2-flash{position:absolute;inset:0;z-index:7;opacity:0;pointer-events:none}
.enh-stage .enh-top{z-index:9}
.enh-stage .enh-ribbon{z-index:10;background:linear-gradient(transparent,rgba(0,0,0,.78) 35%)}
.fxt-btns{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.enh-stage.rune,.enh-stage.rune.safe,.enh-stage.rune.danger{background:radial-gradient(60% 70% at 50% 48%,#1a1511,#070605 75%);background-blend-mode:normal}
.enh-stage.rune.danger{box-shadow:inset 0 0 40px rgba(194,58,48,.3)}
.enh-stage.rune .stage-sq{background:none;overflow:visible}
.enh-stage.rune .stage-sq .fx2-aura{display:none}
.enh-stage .rn-stone.glow{transition:filter .25s}
/* v3.14：防爆卷保護中 → 石碑與符文亮藍光；安定區失敗 → 揭曉時石碑轉紅光 */
.enh-stage.guarded .rn-stone.glow{filter:hue-rotate(185deg) saturate(1.5) brightness(1.1)}
.enh-stage.guarded .stage-sq .rn-spokes{filter:drop-shadow(0 0 4px rgba(255,154,46,.9)) hue-rotate(185deg) saturate(1.5) brightness(1.1)}
.enh-stage.rn-red .rn-stone.glow{filter:hue-rotate(-34deg) saturate(2.6) brightness(1.15)}
.stage-sq .rn-spokes{inset:0;transform:scale(1.42);transform-origin:48.6% 40%;filter:drop-shadow(0 0 4px rgba(255,154,46,.9))} /* v3.13 第 5 款「放大羅盤」：符文光放大到武器外圍，盾牌、大斧也看得到亮到第幾道 */
.stage-sq .rn-stone.sp{opacity:0}

/* ===== 動畫影格 ===== */
/* 同一個抽屜重新繪製（例如強化結束更新內容）時不重播滑入動畫，避免整個畫面跳一下 */
.sheet.still,.scrim.still{animation:none}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes shk{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{50%{filter:brightness(1.25)}}

}

}

}

/* ===== UI 皮膚系統 =====
 * 共用元件基礎類別（由程式加在元件上，本身不帶任何樣式，外觀仍由上方各元件規則決定）：
 *   按鈕 .ui-btn + .ui-btn--primary/secondary/danger/chip/toggle/accent、圓形圖示鈕 .ui-iconbtn、分頁 .ui-tab
 *   面板 .ui-panel、標題 .ui-title、卡片 .ui-card + .ui-card--feature/option/row/slot/bar、標籤 .ui-badge、進度條 .ui-prog
 *   底部抽屜 .ui-sheet、置中彈窗 .ui-modal、提示 .ui-toast、頂部列 .ui-topbar、底部分頁列 .ui-navbar、分頁按鈕 .ui-navtab
 * 美術素材在 skin.js 設定；程式 applySkin() 只為「有設定圖片」的槽位產生 <style id="ui-skin">，沒設定就完全不加樣式。
 * 狀態類別 .is-pressed / .is-disabled / .is-on 只在 UI 元件總覽頁使用，用來顯示按下、停用、選中的樣子。 */
.ui-ic{display:inline-block;width:1.15em;height:1.15em;object-fit:contain;vertical-align:-.2em}

/* ===== 武器框風格試套預覽（開發工具切換 body.fpv；素材為現有武器框換色，只供預覽） ===== */
body.fpv{--fB:url(art/ui/fp_bronze_plain.webp);--fG:url(art/ui/fp_gold_plain.webp);--fR:url(art/ui/fp_red_plain.webp);--fU:url(art/ui/fp_blue_plain.webp);--fN:url(art/ui/fp_green_plain.webp);--fI:url(art/ui/fp_iron_plain.webp)}
/* 共用：拿掉 CSS 線，用素材框；框只畫在元件邊緣，不改版面尺寸 */
.fpv :is(.ui-panel,.ui-sheet,.ui-modal,.ui-card,.vcard,.vlocked,.empty-state,.enh-stage,.warn,.lack-line,.guardline,.ui-toast,
 .ui-btn,.ui-tab,.ui-iconbtn,select,.trow,.matbox,.hico,.dico,.enh-core>div,.enh-more,.powbox,.wt,.wart.qimg,.wart.fb-img,
 .chip,.lvb,.emblem,.qpill,.enh-zone,.tag-up,.wchip,.pill,.slot-pill,.ui-prog):not(#_){border-color:transparent;border-image:var(--f,var(--fB)) 34 / var(--fw,12px) / 0 stretch}
.fpv :is(.ui-panel,.ui-sheet,.ui-modal,.empty-state,.enh-stage,.ui-card--feature,.vcard,.vlocked,.month,.comm,.forge-bar,.warn,.lack-line,.guardline):not(#_){--fw:18px}
.fpv :is(.chip,.lvb,.emblem,.qpill,.enh-zone,.tag-up,.wchip,.pill,.slot-pill,.ui-prog,.dico,.ui-iconbtn,.powbox.inline,.ui-btn--chip):not(#_){--fw:8px}
.fpv .ui-prog.sm:not(#_){--fw:6px}
.fpv :is(.ui-sheet):not(#_){border-image-width:18px 18px 0 18px}
/* 狀態顏色：一般古銅、重點金、危險紅、防爆藍、駐守綠、鎖定鐵灰 */
.fpv :is(.ui-btn--primary,.ui-btn--accent,.ui-tab.on,.ui-btn--toggle.on,.ui-btn--chip.on,.vcard.ready,.vcard.open,.forge-bar,.qpill,.tag-up,.pill.gold,.slot-pill,.wt.on):not(#_){--f:var(--fG)}
.fpv :is(.ui-btn--danger,.vcard.full,.enh-stage.danger,.enh-zone,.risk,.warn,.lack-line,.optcard.lack,.ui-toast.bad):not(#_){--f:var(--fR)}
.fpv :is(.guard,.guardline,.wchip):not(#_){--f:var(--fU)}
.fpv :is(.ui-toast.good):not(#_){--f:var(--fN)}
.fpv :is(.vlocked,.wt.bp.locked,.optcard.off,.ui-btn:disabled):not(#_){--f:var(--fI)}
/* 武器小卡：外框跟稀有度同色（灰綠藍紫金） */

.fpv .wt.on:not(#_){outline:none;--f:var(--fG)}
/* 程式畫的內框線（box-shadow inset）拿掉 */
.fpv :is(.ui-btn--primary,.vcard,.ui-panel,.wt.posted):not(#_){box-shadow:none}
/* 分隔線：標題兩側、頂欄／導航列、資訊列 */

.fpv .goal:not(#_){border-image:url(art/ui/fp_vline.webp) 0 0 0 22 / 0 0 0 5px stretch}

/* ===== v3.17 景深圖層（body.dpv；素材 art/dp/ 為 AI 分層圖） ===== */
.dp{display:none;pointer-events:none}

:root{--mx:0;--my:0}
/* 鐵匠鋪 */
body.dpv .hero{background:#0b0907}
body.dpv .hero .dp-far,body.dpv .hero .dp-glow{position:absolute;inset:-4%;width:108%;height:108%;max-width:none;object-fit:cover;object-position:22% 62%;z-index:0;
  transform:translate(calc(var(--mx) * -5px),calc(var(--my) * -3px))}
body.dpv .hero .dp-far{filter:blur(.6px) brightness(.95);animation:dpSway 14s ease-in-out infinite alternate}
body.dpv .hero .dp-glow{mix-blend-mode:screen;opacity:.7;animation:dpFire 2.4s ease-in-out infinite,dpSway 14s ease-in-out infinite alternate}
body.dpv .hero .dp-glow.g2{filter:blur(12px) brightness(1.4);opacity:.5;animation-duration:1.7s,14s;animation-delay:-.6s,0s}
body.dpv .hero .dp-barrel{position:absolute;right:4%;bottom:6%;width:30%;z-index:0;filter:brightness(.8) blur(.3px);transform:translate(calc(var(--mx) * -2px),0)}
body.dpv .hero .dp-steam{position:absolute;right:10%;bottom:30%;width:18%;opacity:.5;z-index:0;animation:dpSteam 5s ease-in-out infinite}
body.dpv .hero .smith{transform:translateX(calc(-72% + var(--mx) * 2px)) translateY(calc(var(--my) * 1px));animation:dpBreath 5s ease-in-out infinite}
body.dpv .hero .dp-fog{position:absolute;left:0;right:0;bottom:-4%;height:34%;z-index:1;background:url(art/dp/fog_band.webp) 0 100%/auto 100% repeat-x;opacity:.4;animation:dpFogMove 40s linear infinite}
body.dpv .hero .dp-embers{position:absolute;inset:0;z-index:1;overflow:hidden}
.dp-em{position:absolute;bottom:42%;width:16px;opacity:0;animation:dpEmber 4.2s linear infinite}
.dp-em.e0{left:12%}.dp-em.e1{left:20%;width:22px;animation-delay:-.7s;animation-duration:3.6s}.dp-em.e2{left:28%;animation-delay:-1.5s;animation-duration:5s}
.dp-em.e3{left:16%;width:26px;animation-delay:-2.2s}.dp-em.e4{left:34%;width:12px;animation-delay:-2.9s;animation-duration:4.8s}.dp-em.e5{left:24%;width:20px;animation-delay:-3.4s}
.dp-em.e6{left:8%;width:34px;animation-delay:-1.1s;animation-duration:5.4s}.dp-em.e7{left:38%;width:12px;animation-delay:-3.9s}
body.dpv .hero .dp-fg{position:absolute;z-index:1;filter:blur(2.6px) brightness(.7)}
body.dpv .hero .dp-chains{left:-5%;top:-12%;width:15%;transform:translate(calc(var(--mx) * 12px),calc(var(--my) * 6px));animation:dpChain 6s ease-in-out infinite;transform-origin:50% 0}
body.dpv .hero .dp-coal{left:-6%;bottom:-14%;width:34%;filter:blur(2px) brightness(.85);transform:translate(calc(var(--mx) * 14px),calc(var(--my) * 8px))}

@keyframes dpSway{from{translate:-1% 0}to{translate:1% -.6%}}
@keyframes dpBreath{0%,100%{scale:1}50%{scale:1.012}}
@keyframes dpFire{0%,100%{opacity:.5}40%{opacity:.95}70%{opacity:.6}}
@keyframes dpSteam{0%{opacity:0;translate:0 10%;scale:.9}40%{opacity:.5}100%{opacity:0;translate:-8% -30%;scale:1.2}}
@keyframes dpFogMove{from{background-position:0 100%}to{background-position:-1600px 100%}}
@keyframes dpChain{0%,100%{rotate:-1deg}50%{rotate:1.2deg}}
@keyframes dpEmber{0%{opacity:0;transform:translate(0,0) scale(.6)}10%{opacity:1}70%{opacity:.8}100%{opacity:0;transform:translate(26px,-150px) scale(.35) rotate(90deg)}}
/* 強化石碑 */
body.dpv .enh-stage .dp-sback{position:absolute;inset:-5%;width:110%;height:110%;max-width:none;object-fit:cover;filter:blur(1.5px) brightness(.62);z-index:-1;

body.dpv .enh-stage.guarded .dp-smotes img.gold{display:none}body.dpv .enh-stage.guarded .dp-smotes img.blue{display:block}
.dp-smotes .m0{left:18%}.dp-smotes .m1{left:72%;animation-delay:-1.2s;width:30px}.dp-smotes .m2{left:44%;animation-delay:-2.4s;width:16px}.dp-smotes .m3{left:86%;animation-delay:-3.1s;width:14px}.dp-smotes .m4{left:8%;animation-delay:-4s;width:18px}.dp-smotes .m5{left:60%;animation-delay:-4.7s;width:12px}

.ach1 .cb-bar{display:block;height:4px;border-radius:2px;background:#2a2118;overflow:hidden;margin-top:3px}.ach1 .cb-bar i{display:block;height:100%;background:linear-gradient(90deg,#c8742a,#f0c060)}

/* ===== v3.20 登入畫面＋開場故事 ===== */
body.gating{overflow:hidden}

.gt-ly{position:absolute;left:50%;top:50%;height:108%;min-width:108%;object-fit:cover;translate:-50% -50%;max-width:none;
  transform:translate(calc(var(--mx) * -10px),calc(var(--my) * -6px));animation:gtZoom 20s ease-in-out infinite alternate}

.gt-glow{-webkit-mask-image:linear-gradient(transparent 10%,rgba(0,0,0,.2) 30%,#000 58%);mask-image:linear-gradient(transparent 10%,rgba(0,0,0,.2) 30%,#000 58%)}

.gt-fg{position:absolute;left:50%;top:50%;height:108%;min-width:108%;object-fit:cover;translate:-50% -50%;max-width:none;pointer-events:none;
  transform:translate(calc(var(--mx) * 5px),calc(var(--my) * 3px));animation:gtZoomFg 20s ease-in-out infinite alternate;filter:drop-shadow(0 0 12px rgba(0,0,0,.6))}

.gt-em.e5{left:66%;animation-delay:-4.1s}.gt-em.e6{left:74%;width:22px;animation-delay:-2.7s;animation-duration:5.5s}.gt-em.e7{left:84%;animation-delay:-1.6s}.gt-em.e8{left:92%;width:12px;animation-delay:-3.6s}.gt-em.e9{left:24%;width:28px;animation-delay:-4.8s;animation-duration:6.5s}

/* v3.73 村莊怪物血條（方案 B）：縮圖換成怪物、進度條換成血條；動畫只用 transform／opacity */
.vcard .vmon{position:relative;width:64px;height:64px;flex:none}

.vmon:after{content:'';position:absolute;inset:0;border-radius:6px;background:radial-gradient(circle,rgba(255,70,50,.5),transparent 70%);opacity:0;pointer-events:none}
.vmon.hit:after{animation:monFlash .3s ease-out}
.vmon.hit .vthumb{animation:monHit .32s ease-out}

@keyframes monFlash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes monHit{0%{transform:none}25%{transform:translateX(3px) scale(.95)}55%{transform:translateX(-2px)}100%{transform:none}}
@keyframes monKill{0%{opacity:1;transform:none}30%{opacity:0;transform:scale(1.15)}45%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:none}}
@keyframes monSlash{0%{opacity:0;transform:rotate(-38deg) scaleX(.2)}40%{opacity:1}100%{opacity:0;transform:rotate(-38deg) scaleX(1.1)}}
@keyframes monPop{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-22px)}}

/* v4.27 村莊詳情「首次收復獎勵」佔滿一整列，375／393 寬不再換行 */
.kvgrid .kv-wide{grid-column:1/-1}
:root{--l0:#b9b1a3;--l1:#7fcf8c;--l2:#62a8ee;--l3:#ef5b4c;--l4:#c27ff0;--l5:#dff1ff;--l6:#f2b53c}
/* v4.34 武器框顏色看強化等級：l0 灰、l1 綠(+1～+6)、l2 藍(+7～+8)、l3 紅(+9)、l6 金(+10)、l4 紫(+11)、l5 鑽石(+12) */
.l0{color:var(--l0)}.l1{color:var(--l1)}.l2{color:var(--l2)}.l3{color:var(--l3)}.l4{color:var(--l4)}.l5{color:var(--l5);text-shadow:0 0 6px rgba(150,210,255,.55)}.l6{color:var(--l6)}
.l0b{--qc:var(--l0)}.l1b{--qc:var(--l1)}.l2b{--qc:var(--l2)}.l3b{--qc:var(--l3)}.l4b{--qc:var(--l4)}.l5b{--qc:var(--l5)}.l6b{--qc:var(--l6)}
.fpv .wt.l0b:not(#_){--f:url(art/ui/fp_gray_plain.webp)}.fpv .wt.l1b:not(#_){--f:var(--fN)}.fpv .wt.l2b:not(#_){--f:var(--fU)}.fpv .wt.l3b:not(#_){--f:var(--fR)}.fpv .wt.l4b:not(#_){--f:url(art/ui/fp_purple_plain.webp)}.fpv .wt.l5b:not(#_){--f:var(--fI)}.fpv .wt.l6b:not(#_){--f:var(--fG)}
/* +9 以上：一道電流繞著框跑。外層放大 1.42 倍（轉 45° 也蓋得住四角）帶著亮的扇形遮罩轉圈，內層反轉讓框圖不動；只動 transform */
.wart .wart-run{position:absolute;inset:-21%;z-index:3;pointer-events:none;mix-blend-mode:screen;-webkit-mask-image:conic-gradient(transparent 0 62%,rgba(0,0,0,.35) 82%,#000 96%,transparent 100%);mask-image:conic-gradient(transparent 0 62%,rgba(0,0,0,.35) 82%,#000 96%,transparent 100%);animation:frun 2.2s linear infinite;will-change:transform}
.wart .wart-run img{position:absolute;filter:brightness(2.3) saturate(1.2);inset:14.79%;width:70.42%;height:70.42%;animation:frun 2.2s linear infinite reverse;will-change:transform}
@keyframes frun{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.wart .wart-run,.wart .wart-run img{animation:none}}
/* v4.35 背景畫了怪物的關卡：戰鬥畫面只取沒有怪物的那一段 */
.bs-bg.bgp-top{object-position:center 0%;transform:scale(1.3);transform-origin:50% 0}
.bs-bg.bgp-bot{object-position:center 100%}
.bs-bg.bgp-bl{object-position:0 100%;transform:scale(1.6);transform-origin:0 100%}
.bs-bg.bgp-bot2{object-position:center 100%;transform:scale(1.3);transform-origin:50% 100%}
/* v4.35 被打中的閃白光、流血／中毒染色跟著當下動作（待機或攻擊）走 */
.bs-hb i.fl,.bs-hb i.tn{position:absolute;inset:0;display:block}
/* v4.38 駐守村莊點武器的小卡：看武器、換武器、收回武器 */
.ui-panel.vw-pick{display:flex;flex-direction:row;gap:12px;align-items:center;text-align:left}
.vw-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.vw-acts .ui-btn{min-width:0;padding-left:4px;padding-right:4px;white-space:nowrap}
.vcard .wchip[data-act]{cursor:pointer}
/* v4.38 排行榜按鈕拿掉後村莊列只剩 2 顆，小螢幕也排一列 */
@media(max-width:380px){.vbar.two{flex-wrap:nowrap}.vbar.two>.btn:first-child{flex:1 1 auto}.vbar.two>.btn:not(:first-child){flex:0 0 auto}}

  gone:'找不到（可能已經解散或取消了）',full:'公會人數已滿',applied:'已送出申請，等會長或副會長同意',apps:'最多同時申請 5 個公會',none:'你不在公會裡',lead:'會長要先把會長轉讓給別人，才能離開公會',role:'只有會長或副會長可以這樣做',max:'次數已經用完了',lack:'材料不夠',pts:'個人貢獻不夠',len:'公告最多 40 個字',link:'公告不能有網址、電話或 LINE ID',login:'請先登入'};

const GD={d:null,list:null,t:0,busy:false,err:'',tab:'mem',q:'',name:'',join:'open',mk:false,edit:false,note:'',noteJoin:'open',arm:null,mock:null};
const gdIn=()=>!!(S.gd&&S.gd.id);
const gdGold=()=>gdIn()?Math.min(GD_GOLD[9],Math.max(0,S.gd.gold|0)):0,gdBoss=()=>gdIn()?Math.min(GD_BOSS[9],Math.max(0,S.gd.boss|0)):0;   // 由伺服器 guild_mine 更新

const gdOnline=t=>t&&Date.now()-Date.parse(t)<600000;
const gdApi=(fn,body)=>sbRest('rpc/'+fn,{method:'POST',body:JSON.stringify(body||{})});
// 伺服器扣款／發道具前先把存檔傳上去，回來之前暫停自動存檔（和交易所買武器一樣）
async function gdServer(fn,body,apply){if(!await mkSaved())return toast('雲端存檔還沒同步，請稍後再試','bad'),null;CLOUD.busy=true;let r;
  try{r=await gdApi(fn,body);if(r==='session'||(r&&r.r==='session')){CLOUD.busy=false;cloudKicked();return null}if(apply)apply(r)}catch(e){toast(chatSrvErr(e),'bad');return null}finally{CLOUD.busy=false}
  save();CLOUD.dirty=true;cloudPush(true);return r}
// 離線模擬（本機未登入時看畫面用）
function gdMockInit(){if(GD.mock)return;const t=Date.now(),ago=m=>new Date(t-m*60000).toISOString();
  GD.mock={g:null,role:'mem',me:{pts:230,don:GD_DAY,shop:{},cd:null,apps:[]},mem:[{uid:'mock-2',nick:'霜狼',lv:22,role:'lead',wk:1240,tot:5200,at:ago(5)},{uid:'mock-3',nick:'渡鴉',lv:25,role:'vice',wk:980,tot:4100,at:ago(1)},{uid:'mock-0',nick:'雷霆之錘',lv:18,role:'mem',wk:760,tot:2300,at:ago(120)},{uid:'mock-1',nick:'冰原少女',lv:9,role:'mem',wk:320,tot:900,at:ago(2)},{uid:'mock-4',nick:'北境小鐵',lv:14,role:'mem',wk:150,tot:400,at:ago(1500)}],
    apps:[{uid:'mock-9',nick:'雪原新手',lv:4,at:ago(30)}],list:[{id:1,name:'霜狼鍛造會',emb:'霜',lv:3,n:12,cap:20,join_mode:'open'},{id:2,name:'渡鴉之巢',emb:'渡',lv:5,n:28,cap:30,join_mode:'apply'},{id:3,name:'雷神鐵砧',emb:'雷',lv:1,n:4,cap:20,join_mode:'open'},{id:4,name:'世界樹守望',emb:'世',lv:2,n:20,cap:20,join_mode:'open'}]}}
function gdMockD(){const m=GD.mock,g=m.g;if(!g)return{g:null,me:m.me};const lv=gdLvOf(g.exp),me={uid:'me',nick:S.nick||'我',lv:smithLv(),role:m.role,wk:m.wk||0,tot:m.wk||0,at:new Date().toISOString()};
  return{g:{...g,lv,gold:GD_GOLD[lv-1],boss:GD_BOSS[lv-1],cap:gdCap(lv),n:m.mem.length+1,rank:2,wk:m.mem.reduce((a,x)=>a+x.wk,0)+(m.wk||0)},role:m.role,me:m.me,mem:[...m.mem.filter(x=>x.role!=='mem'),me,...m.mem.filter(x=>x.role==='mem')].sort((a,b)=>(a.role==='lead'?0:a.role==='vice'?1:2)-(b.role==='lead'?0:b.role==='vice'?1:2)||b.wk-a.wk),apps:m.role==='mem'?[]:m.apps}}
function gdSync(){const g=GD.d&&GD.d.g;const v=g?{id:g.id,name:g.name,emb:g.emb,lv:g.lv,gold:g.gold|0,boss:g.boss|0}:null;if(JSON.stringify(v)!==JSON.stringify(S.gd||null)){S.gd=v;save();CLOUD.dirty=true}}
async function gdLoad(quiet){if(GD.busy)return;if(chatMock()){gdMockInit();GD.d=gdMockD();if(!GD.d.g)GD.list=GD.mock.list.filter(x=>!GD.q||x.name.includes(GD.q)).map(x=>({...x,applied:GD.mock.me.apps.includes(x.id)}));gdSync();GD.t=Date.now();if(!quiet)render();return}
  if(!chatOn())return;GD.busy=true;
  try{GD.d=await gdApi('guild_mine');if(!GD.d.g)GD.list=await gdApi('guild_list',{p_q:GD.q||null});GD.err='';gdSync()}catch(e){GD.err=chatSrvErr(e)}finally{GD.busy=false;GD.t=Date.now()}
  if(!quiet&&ui.sheet&&(ui.sheet.t==='gd'||ui.sheet.t==='chat'))render()}
if(typeof window!=='undefined')setInterval(()=>{if(chatOn()&&!document.hidden&&Date.now()-GD.t>(ui.sheet&&ui.sheet.t==='gd'?20000:300000))gdLoad(!(ui.sheet&&ui.sheet.t==='gd'))},5000);
function gdOpen(tab){if(tab)GD.tab=tab;GD.arm=null;ui.sheet={t:'gd',k:GD.tab};render();gdLoad()}
// ---- 動作 ----
async function gdCreate(){const nm=String(GD.name||'').trim(),n=Array.from(nm).length;
  if(smithLv()<GD_MK_LV&&!CLOUD.admin)return toast(GD_MSG.lv,'bad');if(n<2||n>8||/\s/.test(nm)||chatPre(nm))return toast(GD_MSG.name,'bad');if(S.gold<GD_COST)return toast(GD_MSG.gold,'bad');
  if(chatMock()){gdMockInit();S.gold-=GD_COST;GD.mock.g={id:9,name:nm,emb:Array.from(nm)[0],notice:'',join:GD.join,exp:0};GD.mock.role='lead';GD.mock.mem=GD.mock.mem.slice(0,0);GD.mock.wk=0}
  else{const r=await gdServer('guild_create',{p_sid:SID,p_name:nm,p_join:GD.join},r=>{if(r==='ok')S.gold=Math.max(0,S.gold-GD_COST)});if(r==null)return;if(r!=='ok')return toast(gdErr(r),'bad')}
  GD.mk=false;GD.name='';GD.tab='mem';snd('unlock');toast(`公會「${esc(nm)}」建立完成！`,'ok');await gdLoad()}
async function gdJoin(id){if(chatMock()){gdMockInit();const x=GD.mock.list.find(y=>y.id===id);if(!x)return;if(GD.mock.me.cd&&Date.parse(GD.mock.me.cd)>Date.now())return toast(GD_MSG.cd,'bad');if(x.n>=x.cap)return toast(GD_MSG.full,'bad');
    if(x.join_mode==='apply'){if(!GD.mock.me.apps.includes(id))GD.mock.me.apps.push(id);toast(GD_MSG.applied,'ok')}else{GD.mock.g={id:x.id,name:x.name,emb:x.emb,notice:'每週日晚上一起衝首領，記得捐獻！',join:'open',exp:GD_LV[x.lv-1]+400};GD.mock.role='mem';snd('unlock');toast(`已加入「${esc(x.name)}」`,'ok')}return gdLoad()}
  try{const r=await gdApi('guild_join',{p_sid:SID,p_gid:id});if(r==='session')return cloudKicked();if(r==='ok'){snd('unlock');toast('已加入公會！','ok')}else toast(gdErr(r,r==='lv'?'':''),r==='applied'?'ok':'bad')}catch(e){toast(chatSrvErr(e),'bad')}gdLoad()}
async function gdUnapply(id){if(chatMock()){GD.mock.me.apps=GD.mock.me.apps.filter(x=>x!==id)}else{try{await gdApi('guild_unapply',{p_gid:id})}catch(e){return toast(chatSrvErr(e),'bad')}}toast('已取消申請');gdLoad()}
async function gdLeave(){if(GD.arm!=='leave'){GD.arm='leave';render();return toast(GD.d&&GD.d.role==='lead'&&GD.d.g&&GD.d.g.n<=1?'再按一次：你是最後一個人，公會會解散':`再按一次確認離開（${GD_CD_H} 小時內不能加入別的公會）`)}GD.arm=null;
  if(chatMock()){if(GD.mock.role==='lead'&&GD.mock.mem.length)return toast(GD_MSG.lead,'bad');GD.mock.g=null;GD.mock.me.cd=new Date(Date.now()+GD_CD_H*3600e3).toISOString();CHAT.g=[];toast('已離開公會');return gdLoad()}
  try{const r=await gdApi('guild_leave',{p_sid:SID});if(r==='session')return cloudKicked();if(r==='ok'||r==='disband'){CHAT.g=[];CHAT.glast=0;toast(r==='disband'?'公會已解散':'已離開公會')}else toast(gdErr(r),'bad')}catch(e){toast(chatSrvErr(e),'bad')}gdLoad()}
async function gdSet(){const nt=String(GD.note||'').replace(/\s+/g,' ').trim();if(Array.from(nt).length>40)return toast(GD_MSG.len,'bad');if(nt&&chatPre(nt))return toast(GD_MSG.link,'bad');
  if(chatMock()){GD.mock.g.notice=nt;GD.mock.g.join=GD.noteJoin}else{try{const r=await gdApi('guild_set',{p_sid:SID,p_notice:nt,p_join:GD.noteJoin});if(r==='session')return cloudKicked();if(r!=='ok')return toast(gdErr(r),'bad')}catch(e){return toast(chatSrvErr(e),'bad')}}
  GD.edit=false;toast('公會設定已儲存','ok');gdLoad()}
async function gdAppAns(uid,ok){if(chatMock()){const a=GD.mock.apps.find(x=>x.uid===uid);GD.mock.apps=GD.mock.apps.filter(x=>x.uid!==uid);if(ok&&a)GD.mock.mem.push({...a,role:'mem',wk:0,tot:0,at:new Date().toISOString()});toast(ok?'已同意入會':'已拒絕');return gdLoad()}
  try{const r=await gdApi('guild_app_ans',{p_sid:SID,p_uid:uid,p_ok:!!ok});if(r==='session')return cloudKicked();if(r==='ok')toast('已同意入會','ok');else if(r==='no')toast('已拒絕');else toast(r==='in'?'他已經加入別的公會了':gdErr(r),'bad')}catch(e){toast(chatSrvErr(e),'bad')}gdLoad()}
async function gdMemAct(uid,act){const nm=(GD.d&&(GD.d.mem||[]).find(x=>x.uid===uid)||{}).nick||'';const k=act+uid;
  if((act==='kick'||act==='lead')&&PC.arm!==k){PC.arm=k;pcShow();return toast(act==='kick'?`再按一次把 ${esc(nm)} 踢出公會`:`再按一次把會長轉讓給 ${esc(nm)}（你會變成副會長）`)}PC.arm=null;
  if(chatMock()){const m=GD.mock,x=m.mem.find(y=>y.uid===uid);if(!x)return;if(act==='kick')m.mem=m.mem.filter(y=>y!==x);else if(act==='vice')x.role='vice';else if(act==='unvice')x.role='mem';else if(act==='lead'){m.mem.forEach(y=>{if(y.role==='lead')y.role='mem'});x.role='lead';m.role='vice'}}
  else{try{const r=await gdApi('guild_mem_act',{p_sid:SID,p_uid:uid,p_act:act});if(r==='session')return cloudKicked();if(r!=='ok'){toast(r==='max'?'副會長最多 2 位':gdErr(r),'bad');return pcShow()}}catch(e){toast(chatSrvErr(e),'bad');return pcShow()}}
  toast({kick:`已把 ${esc(nm)} 踢出公會`,vice:`${esc(nm)} 升為副會長`,unvice:`已取消 ${esc(nm)} 的副會長`,lead:`會長已轉讓給 ${esc(nm)}`}[act]||'完成','ok');await gdLoad(true);if(act==='kick')ui.result=null;else pcShow();render()}
async function gdDonate(k){const x=GD_DON.find(y=>y.k===k),me=GD.d&&GD.d.me;if(!x||!me)return;if(me.don<=0)return toast(`今天 ${GD_DAY} 次捐獻都用完了，明天再來`,'bad');if(gdBal(k)<x.c)return toast(`${x.n.replace(/^\d[\d,]* ?個?/,'')}不夠`,'bad');
  const pay=()=>{S[k]-=x.c};let up=false;
  if(chatMock()){pay();const g=GD.mock.g,l0=gdLvOf(g.exp);g.exp+=x.p;up=gdLvOf(g.exp)>l0;GD.mock.me.don--;GD.mock.me.pts+=x.p;GD.mock.wk=(GD.mock.wk||0)+x.p}
  else{const r=await gdServer('guild_donate',{p_sid:SID,p_kind:k},r=>{if(r&&r.r==='ok')pay()});if(r==null)return;if(r.r!=='ok')return toast(r.r==='max'?`今天 ${GD_DAY} 次捐獻都用完了，明天再來`:r.r==='lack'?'雲端存檔的數量不夠，請稍後再試':gdErr(r.r),'bad');up=!!r.up}
  snd(up?'unlock':'deliver');toast(`捐獻 ${x.n}：公會經驗 +${x.p}、個人貢獻 +${x.p}`,'ok');await gdLoad(true);if(up&&GD.d&&GD.d.g)toast(`公會升到 Lv.${GD.d.g.lv}！`,'ok');render()}
async function gdShop(k){const x=GD_SHOP.find(y=>y.k===k),me=GD.d&&GD.d.me;if(!x||!me)return;const n=(me.shop&&me.shop[k])|0;if(n>=x.lim)return toast('這週這個道具已經換完了','bad');if((me.pts|0)<x.p)return toast(GD_MSG.pts,'bad');
  const give=()=>{S.items[k]=(S.items[k]||0)+x.x};
  if(chatMock()){give();me.pts-=x.p;me.shop={...me.shop,[k]:n+1}}
  else{const r=await gdServer('guild_shop',{p_sid:SID,p_item:k},r=>{if(r==='ok')give()});if(r==null)return;if(r!=='ok')return toast(r==='max'?'這週這個道具已經換完了':gdErr(r),'bad')}
  snd('deliver');toast(`兌換 ${x.n} ×${x.x}`,'ok');await gdLoad(true);render()}

function mkMockDB(){let d=null;try{d=JSON.parse(localStorage.getItem('nrs-mkmock')||'null')}catch(e){}
  if(!d){d={seq:1,rows:[]};const bps=BPS.filter(b=>b.t<=1);for(let k=0;k<12;k++){const b=bps[(k*7)%bps.length],q=Math.min(4,(k*3)%5),lv=(k*5)%10,cur=k%3?'gold':'gems';
    d.rows.push({id:d.seq++,seller:'npc',seller_nick:LB_NAMES[k%LB_NAMES.length].split('・')[0],weapon:{b:b.id,q,lv,traits:[],ench:[null,null,null,null]},bp:b.id,lv,q,cur,price:cur==='gold'?(300+k*137)*(lv+1):20+k*9,status:'open',created_at:new Date(Date.now()-k*36e5).toISOString(),expires_at:new Date(Date.now()+(MK_DAYS*24-k*5)*36e5).toISOString(),settled:false,buyer_ack:false})}}
  return d}
const mkMockSave=d=>{try{localStorage.setItem('nrs-mkmock',JSON.stringify(d))}catch(e){}};
async function mkMockApi(fn,a){const d=mkMockDB(),now=Date.now(),me='me';let out=null;
  if(fn==='browse')out=d.rows.filter(r=>r.status==='open'&&Date.parse(r.expires_at)>now);
  else if(fn==='mine')out=d.rows.filter(r=>r.seller===me&&r.status==='open');
  else if(fn==='list'){if(!(a.p_price>=MK_MIN))throw new Error('bad price');if(d.rows.filter(r=>r.seller===me&&r.status==='open'&&Date.parse(r.expires_at)>now).length>=MK_MAX)throw new Error('listing limit');
    out=d.seq;d.rows.unshift({id:d.seq++,seller:me,seller_nick:S.nick||'我',weapon:a.p_weapon,bp:a.p_bp,lv:a.p_lv,q:a.p_q,cur:a.p_cur,price:a.p_price,status:'open',created_at:new Date().toISOString(),expires_at:new Date(now+MK_DAYS*864e5).toISOString(),settled:false,buyer_ack:false})}
  else if(fn==='buy'){const r=d.rows.find(r=>r.id===a.p_id&&r.status==='open'&&Date.parse(r.expires_at)>now);if(!r||r.seller===me)throw new Error('not available');r.status='sold';r.buyer=me;out=r}
  else if(fn==='cancel'){const r=d.rows.find(r=>r.id===a.p_id&&r.seller===me&&r.status==='open');if(!r)throw new Error('not available');r.status='cancelled';out=r}
  else if(fn==='pending'){d.rows.forEach(r=>{if(r.seller===me&&r.status==='open'&&Date.parse(r.expires_at)<=now)r.status='expired'});out=d.rows.filter(r=>(r.seller===me&&!r.settled&&r.status!=='open')||(r.buyer===me&&!r.buyer_ack))}
  else if(fn==='ack'){d.rows.forEach(r=>{if(!a.p_ids.includes(r.id))return;if(r.seller===me)r.settled=true;if(r.buyer===me)r.buyer_ack=true})}
  mkMockSave(d);return JSON.parse(JSON.stringify(out))}
// ---- 伺服器 ----
async function mkApi(fn,a={}){if(mkMock())return mkMockApi(fn,a);if(!AUTH)throw new Error('尚未登入');
  if(fn==='browse')return sbRest('market?select=id,seller,seller_nick,weapon,bp,lv,q,cur,price,expires_at,created_at&status=eq.open&expires_at=gt.'+encodeURIComponent(new Date().toISOString())+'&order=created_at.desc&limit=80');
  if(fn==='mine')return sbRest('market?select=id,seller,seller_nick,weapon,bp,lv,q,cur,price,expires_at,created_at&seller=eq.'+AUTH.user.id+'&status=eq.open&order=created_at.desc');
  return sbRest('rpc/market_'+fn,{method:'POST',body:JSON.stringify({...a,p_sid:SID})})}
const mkMe=r=>mkMock()?r.seller==='me':AUTH&&r.seller===AUTH.user.id;
const mkMeBuyer=r=>mkMock()?r.buyer==='me':AUTH&&r.buyer===AUTH.user.id;
// 確定存檔已上傳雲端（離線模擬視為成功）
async function mkSaved(){save();if(!AUTH)return true;for(let k=0;k<20&&CLOUD.busy;k++)await new Promise(r=>setTimeout(r,150));await cloudPush(true);return !CLOUD.dirty&&!CLOUD.err&&!CLOUD.kicked}
async function mkLoad(){if(MK.loading)return MK.p;MK.loading=true;MK.err='';mkRender();return MK.p=(async()=>{
  try{const [a,b]=await Promise.all([mkApi('browse'),mkApi('mine')]);MK.rows=(a||[]).filter(r=>BP[bpId(r.bp)]);MK.mine=(b||[]).filter(r=>BP[bpId(r.bp)]);MK.t=Date.now();await mkReconcile(true)}
  catch(e){MK.err=MK_ERR(e.message);console.warn('market',e.message)}finally{MK.loading=false;mkRender()}})()}
const mkRender=()=>{if(ui.tab==='market'||ui.sheet&&/^mk/.test(ui.sheet.t))render()};
function mkGive(w){const o={...JSON.parse(JSON.stringify(w)),id:S.nextId++,lock:false,test:false,created:NOW()};delete o.oid;delete o.ocr;o.b=bpId(o.b);o.traits=o.traits||[];o.ench=[0,1,2,3].map(i=>(o.ench||[])[i]||null);S.weapons.push(o);return o}
// 對帳：成交入帳、過期／下架退回、我買到的武器、我上架但背包還在的武器；全部只處理一次，存檔上傳成功才回報伺服器
let MK_REC=false;
async function mkReconcile(quiet){if((!AUTH||!CLOUD.ready)&&!mkMock())return;if(MK_REC)return;MK_REC=true;
  try{const L=mkLedger();let changed=false,g=0,m=0,back=0,got=[],ack=[];
    for(const r of MK.mine||[])if(!L.listed.includes(r.id)){mkTake(r);mkMark('listed',r.id);changed=true}   // 上架成功但當時沒存到檔
    const rs=await mkApi('pending')||[];
    const claim=[];
    for(const r of rs){
      if(mkMe(r)){if(!L.listed.includes(r.id)){mkTake(r);mkMark('listed',r.id);changed=true}
        if(!L.done.includes(r.id)){if(r.status!=='cancelled'){claim.push(r);continue}   // v4.08 賣出／過期：留著等玩家在交易所按「領取」才入帳，伺服器也先不回報
          mkGive(r.weapon);back++;mkMark('done',r.id);changed=true}}
      else if(mkMeBuyer(r)){if(!L.got.includes(r.id)){if(!mkPaid(r.id))S[r.cur]=Math.max(0,S[r.cur]-r.price);const w=mkGive(r.weapon);got.push(BP[w.b].n+' +'+w.lv);mkMark('got',r.id);changed=true}}
      ack.push(r.id)}
    const fresh=claim.filter(r=>!MK.seen.includes(r.id));MK.claim=claim.concat(MK.claim.filter(r=>r.fake));MK.seen.push(...fresh.map(r=>r.id));
    if(fresh.length)toast(`交易所有 ${fresh.length} 件${fresh.some(r=>r.status==='sold')?'賣出':'退回'}，到交易所領取`,'ok');
    if(changed&&!(await mkSaved()))return;   // 存檔沒上傳成功：先不回報，下次再對一次（帳本保證不會重複）
    if(ack.length)await mkApi('ack',{p_ids:ack});
    const msg=[g||m?`交易所成交入帳：${g?fmt(g)+' 金幣':''}${g&&m?'、':''}${m?fmt(m)+' 鑽':''}（已扣 5% 手續費）`:'',back?`${back} 件武器已退回道具欄（下架或 ${MK_DAYS} 天未售出）`:'',got.length&&!quiet?'':got.length?'已補發購買的武器：'+got.join('、'):''].filter(Boolean);
    if(g||m||back||got.length){S.mkNew=(S.mkNew||0)+1;save()}   // v3.64 交易所紅點
    if(msg.length)toast(msg.join('<br>'),'ok');if(changed||fresh.length||ui.tab==='market')render()}
  catch(e){if(!quiet)toast('交易所對帳失敗：'+MK_ERR(e.message),'bad')}finally{MK_REC=false}}
const mkSettle=q=>mkReconcile(q);
// v4.08 交易所待領取：按「全部領取」才把賣出的錢／過期的武器入帳，存檔上傳成功才回報伺服器（帳本保證只入帳一次）
const mkNet=r=>Math.floor(r.price*(1-MK_FEE));
async function mkClaim(){if(ui.mkBusy||!MK.claim.length)return;ui.mkBusy=true;render();
  try{const L=mkLedger(),rs=MK.claim.slice(),real=rs.filter(r=>!r.fake);let g=0,m=0,back=0;
    for(const r of real){if(L.done.includes(r.id))continue;if(r.status==='sold'){const n=mkNet(r);if(r.cur==='gems'){S.gems+=n;m+=n}else{S.gold+=n;g+=n}}else{mkGive(r.weapon);back++}mkMark('done',r.id)}
    MK.claim=[];
    if(real.length){if(!(await mkSaved()))throw new Error('存檔還沒上傳成功，已入帳，稍後會自動回報');await mkApi('ack',{p_ids:real.map(r=>r.id)})}
    const fk=rs.filter(r=>r.fake);fk.forEach(r=>{if(r.status==='sold'){const n=mkNet(r);r.cur==='gems'?m+=n:g+=n}else back++});
    snd('coin');toast(`${fk.length&&!real.length?'（測試，不會真的入帳）<br>':''}已領取${g?'：'+fmt(g)+' 金幣':''}${m?(g?'、':'：')+fmt(m)+' 鑽石':''}${back?`<br>${back} 件武器已放回道具欄`:''}`,'ok')}
  catch(e){toast('領取：'+MK_ERR(e.message),'bad')}finally{ui.mkBusy=false;render()}}
function mkClaimBox(){if(!MK.claim.length)return '';const rs=MK.claim,g=rs.filter(r=>r.status==='sold'&&r.cur!=='gems').reduce((a,r)=>a+mkNet(r),0),m=rs.filter(r=>r.status==='sold'&&r.cur==='gems').reduce((a,r)=>a+mkNet(r),0);
  const row=r=>{const w=r.weapon||{},b=BP[bpId(r.bp)];if(!b)return '';const sold=r.status==='sold';
    return `<div class="ui-card ui-card--row mk-row mk-cl-row"><div class="mk-art">${wArt(b.id,{frame:fq(w)})}</div><div class="grow mk-mid"><b class="${lc(w)}">${b.n} <span class="lvt">+${w.lv}</span></b><span class="small muted">${sold?`售價 ${fmt(r.price)}`:`${MK_DAYS} 天未售出`}</span></div>${sold?mkPrice(r.cur,mkNet(r)):'<span class="small muted mk-cl-back">退回道具欄</span>'}</div>`};
  return `<div class="mk-claim"><div class="mk-cl-head"><b class="t-gold grow">待領取 ${rs.length} 件</b>${btn(ui.mkBusy?'領取中…':'全部領取','mkclaim',{cls:'btn-primary sm',dis:ui.mkBusy})}</div>
   <div class="mk-list">${rs.map(row).join('')}</div>${g||m?`<div class="mk-cl-sum"><span class="small muted grow">實收（扣 ${MK_FEE*100}%）</span>${g?mkPrice('gold',g):''}${m?mkPrice('gems',m):''}</div>`:''}</div>`}
async function mkList(id,cur,price){const w=S.weapons.find(x=>x.id===id);if(!w)return toast('找不到這把武器','bad');if(!mkSellable(w))return toast('上鎖或駐守村莊中的武器不能上架','bad');
  price=Math.floor(+price);if(!(price>=MK_MIN))return toast(`最低售價 ${MK_MIN}`,'bad');if(price>MK_MAXP[cur])return toast(`最高售價 ${fmt(MK_MAXP[cur])}`,'bad');
  if(MK.mine.length>=MK_MAX)return toast(`同時最多上架 ${MK_MAX} 件`,'bad');if(ui.mkBusy)return;ui.mkBusy=true;
  try{if(!(await mkSaved()))throw new Error('存檔還沒上傳成功，請稍後再試');const nid=await mkApi('list',{p_weapon:mkClean(w),p_bp:w.b,p_lv:w.lv,p_q:w.q,p_cur:cur,p_price:price,p_nick:S.nick||'無名鐵匠'});
    const ix=S.weapons.indexOf(w);if(ix>=0)S.weapons.splice(ix,1);if(nid)mkMark('listed',+nid);await mkSaved();
    toast(`已上架：${BP[w.b].n} +${w.lv}，${fmt(price)} ${MK_CUR[cur][1]}`,'ok');ui.sheet=null;MK.tab='mine';snd('deliver')}
  catch(e){toast('上架失敗：'+MK_ERR(e.message),'bad')}finally{ui.mkBusy=false;mkLoad()}}   // 失敗時武器沒動過；若其實上架成功，mkLoad 對帳會自動移出背包
async function mkBuy(id){const r=MK.rows.find(x=>x.id===id);if(!r)return;if(mkMe(r))return toast('不能買自己上架的武器','bad');
  if(S[r.cur]<r.price)return toast(`${MK_CUR[r.cur][1]}不足`,'bad');if(ui.mkBusy)return;ui.mkBusy=true;
  try{if(!(await mkSaved()))throw new Error('存檔還沒上傳成功，請稍後再試');   // v3.63 伺服器用雲端存檔的錢判斷夠不夠，先存檔
    CLOUD.busy=true;let row,w;   // 成交到本機扣款之間暫停自動存檔，避免把還沒扣款的金額存上去
    try{const x=await mkApi('buy',{p_id:id});row=x&&x.id?x:r;mkPaid(row.id);S[row.cur]=Math.max(0,S[row.cur]-row.price);w=mkGive(row.weapon);mkMark('got',row.id)}finally{CLOUD.busy=false}
    if(await mkSaved())await mkApi('ack',{p_ids:[row.id]}).catch(()=>{});snd('coin');toast(`購買成功：${BP[w.b].n} +${w.lv} 已放進道具欄`,'ok');ui.sheet=null}
  catch(e){toast('購買失敗：'+MK_ERR(e.message),'bad')}finally{ui.mkBusy=false;mkLoad()}}   // 若其實已成交，mkLoad 對帳會補發武器並扣款
async function mkCancel(id){if(ui.mkBusy)return;ui.mkBusy=true;
  try{await mkApi('cancel',{p_id:id});toast('已下架，武器退回道具欄','ok')}
  catch(e){toast('下架失敗：'+MK_ERR(e.message),'bad')}finally{ui.mkBusy=false;await mkLoad()}}   // 退回武器統一由對帳處理（只會退一次）

// 聲望經驗：升級時發天賦點（由等級推算）和聲望寶箱，升級提示延後顯示，避免被收成／鍛造的提示蓋掉
function repGain(n){const r=S.rep;if(!r||!(n>0)||QUIET)return 0;   // 快速測試（QUIET）不加聲望，避免寶箱道具干擾其他測試的計數
  r.xp+=Math.floor(n);let up=0;const got={};
  while(r.xp>=repNeed(r.lv)){r.xp-=repNeed(r.lv);r.lv++;up++;const bx=repBox(r.lv);for(const k in bx){S.gold+=bx[k];got[k]=(got[k]||0)+bx[k]}}
  if(up&&!repGain.mute&&typeof toast==='function')setTimeout(()=>{toast(`鐵匠聲望升到 Lv.${r.lv}！獲得 ${up} 天賦點<br>聲望寶箱：${Object.entries(got).map(([k,v])=>(k==='gold'?'金幣':itemName(k))+' ×'+fmt(v)).join('、')}`,'ok');if(typeof snd==='function')snd('unlock')},600);
  return up}

async function bossBoard(force){if(!AUTH||BOSS_G.loading||(!force&&Date.now()-BOSS_G.t<30000))return;BOSS_G.loading=true;
  try{const wk=evtWeek();BOSS_G.b=await sbRest('rpc/boss_board',{method:'POST',body:JSON.stringify({p_week:wk})});

async function bossPostCloud(id){const r=bossPostCore(id);if(r.err)return r;const w=W(id);

  let sv=null;try{if(r.vi>=0)await cloudPush(true);sv=await call()}catch(x){const m=String(x.message||'');let ok=false;
    if(/weapon not saved|weapon busy/.test(m)){try{await cloudPush(true);sv=await call();ok=true}catch(y){x=y}}
    if(!ok){const v=evtSt();v.slots[r.slot]=null;save();return{err:bossErr(String(x.message||''))}}}
  const x=evtSt().slots[r.slot];if(sv&&sv.pw>0&&x){x.pw=r.pw=sv.pw;save()}   // 以伺服器算的每小時傷害為準
  bossBoard(true);return r}

// 強化判定（唯一入口）。所有費用都用 enhCost；道具不足時直接拒絕，不會默默改成無保護強化。
// 測試武器（w.test）：不扣任何資源、不計入統計，可接受開發工具指定的結果，避免動到正式資料。
function enhanceCore(id,opt={}){
  const w=W(id);if(!w)return{err:'找不到武器'};if(busyW(w))return{err:'駐守中的武器要先收回'};if(w.lv>=15)return{err:'已經是最高等級 +15'};
  const next=w.lv+1,cost=enhCost(w),danger=next>stable(w),test=!!w.test;
  if(!test&&S.gold<cost)return{err:'金幣不夠',need:'gold'};
  if(!test){S.gold-=cost;S.stats.enhTry++}
  // v3.14：危險區勾選防爆卷，每次強化都消耗 1 張（不論成功、失敗或爆裝）
  const usedScroll=!!(opt.scroll&&danger&&test);   // v4.43 防爆卷刪除，只剩測試武器的開發選項
  let r=RATE[next];const bc=breakChance(w,next);
  let usedBless=false;if(opt.bless&&test){r=Math.min(1,r+.1);usedBless=true}
  const f=test?opt.force:null;
  const out=f==='ok'?'ok':f==='fail'?'fail':(f==='break'||f==='saved')?'break':rollEnhance(r,bc),before={art:A(w.b),name:bpOf(w).n,q:w.q,from:w.lv,tier:bpOf(w).t};
  if(out==='ok'){w.lv=next;if(!test){S.stats.enhOk++;S.stats.maxLv=Math.max(S.stats.maxLv,next);newsQueue(w.b,next,true);repGain(next)}save();return{k:'ok',next,danger,before,usedBless,usedScroll,w,test}}
  if(!test)S.stats.enhFail++;
  if(out==='break'){
    if(f==='saved'||(f!=='break'&&usedScroll)){save();return{k:'saved',next,danger,before,usedBless,usedScroll,test}}
    S.weapons.splice(S.weapons.indexOf(w),1);if(!test){S.stats.breaks++;newsQueue(w.b,next,false)}save();return{k:'broke',next,danger,before,usedBless,test}}
  save();return{k:'fail',next,danger,before,usedBless,usedScroll,test};
}

}

  {k:'hp',ic:'mon_1',n:'怪物血條',s:'打中才扣血，扣多少＝傷害',v:'4.26',h:'村莊卡上的怪物有血條，武器打中才會扣血，扣多少就是造成的傷害。<br>還沒交付或沒有駐守武器的村莊，點開詳情上方有怪物大圖，按 ‹ › 翻看這一界 10 隻（還沒解鎖的只顯示黑影）。<br>怪物被打倒就完成一輪狩獵，換下一隻。<br>點村莊看詳情，血條同步顯示，下方還有這隻北歐神話怪物的稱號和傳說。每一界的最後一關都是神，每一關的名稱、條件、掉落都跟那隻怪物或神的故事有關：打神要神聖、打龍要剋龍、火要霜寒。'},
  {k:'hit',ic:'cat_sword',n:'武器打法',s:'攻速不同、強化越高越常觸發附加效果',v:'4.39',h:'點村莊卡片下方的<b>往下箭頭</b>（或怪物小圖），會展開戰鬥畫面（一次一個，再點一下收起），下面還列出每輪掉落和已經打到、還沒收成的東西：騎士拿著駐守的武器打怪物，打中時怪物閃一下、停頓後被打退，跳出的數字就是傷害。戰鬥畫面收起時，卡片上的小怪物也是同樣的攻速和附加效果。<br>攻速：<b>劍</b> 1.0 秒、<b>斧</b> 1.3 秒（兩連斬）、<b>錘</b> 1.8 秒、<b>短刃</b> 0.6 秒、<b>長柄</b> 1.2 秒、<b>弓</b> 1.1 秒、<b>弩</b> 1.6 秒。<br>強化越高越常觸發附加效果（+1～+6 每級 2%，+7 起 16%～40%）：劍<b>會心</b>、斧<b>流血</b>、錘<b>震碎</b>、短刃<b>中毒</b>、長柄<b>貫穿</b>、弓<b>穿心</b>、弩<b>破甲</b>。狩獵時間和收成不受影響。'},
  {k:'realm',ic:'realm_2',n:'第二界 約頓海姆',s:'收復 1-10 後開放',v:'4.37',h:'收復 1-10 彩虹橋頭、打倒海姆達爾後開放第二界，用上方地圖列切換。<br>10 座新村莊、4 種新材料（巨人骨、永凍霜晶、雷鳴鐵、世界樹古根），第五階巨人武器要熔爐 Lv6。<br>v4.37 起巨人體重鍊已經拿掉，第二界材料用來鍛造巨人武器。'}]],
